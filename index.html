<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rosco de la A a la Z - IEM Salta (UNSa)</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <!-- Babel compiler for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Outfit', sans-serif;
            background: radial-gradient(circle at center, #1e1b4b 0%, #0f172a 100%);
            color: #f8fafc;
            min-height: 100vh;
        }

        .rosco-node {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .rosco-node.active {
            transform: scale(1.25);
            box-shadow: 0 0 20px #fbbf24, 0 0 35px #f59e0b;
            z-index: 30;
        }

        .pulse-active {
            animation: pulse-glow 1.5s infinite alternate;
        }

        @keyframes pulse-glow {
            0% { box-shadow: 0 0 10px #38bdf8, 0 0 20px #0284c7; }
            100% { box-shadow: 0 0 25px #38bdf8, 0 0 40px #0284c7; }
        }

        .glass-panel {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body class="flex flex-col justify-between min-h-screen selection:bg-indigo-500 selection:text-white">

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // Base de preguntas del Rosco del IEM Salta
        const ROSCO_DATA = [
            { letter: 'A', type: 'EMPIEZA', answer: 'ARTURO', clue: 'Nombre del insigne médico salteño y exministro de Salud de la Nación que da nombre al IEM.' },
            { letter: 'B', type: 'EMPIEZA', answer: 'BOLIVIA', clue: 'Avenida (N° 5150) sobre la cual se ubica el predio de la UNSa donde se encuentra el colegio.' },
            { letter: 'C', type: 'EMPIEZA', answer: 'CASTAÑARES', clue: 'Barrio y predio universitario en la zona norte de Salta donde funciona el IEM.' },
            { letter: 'D', type: 'EMPIEZA', answer: 'DIRECTOR', clue: 'Cargo unipersonal de máxima autoridad ejecutiva y pedagógica del instituto.' },
            { letter: 'E', type: 'EMPIEZA', answer: 'ESTUDIANTES', clue: 'Jóvenes que transitan sus 6 años de formación secundaria en las aulas del colegio.' },
            { letter: 'F', type: 'EMPIEZA', answer: 'FORMACION', clue: 'Primera palabra clave del título de grado: Bachiller en ________ y Evaluación de Proyectos.' },
            { letter: 'G', type: 'EMPIEZA', answer: 'GABRIELA', clue: 'Nombre de la Vicedirectora turno tarde.' },
            { letter: 'H', type: 'EMPIEZA', answer: 'HUMANIDADES', clue: 'Área del conocimiento y orientaciones sociales destacadas en la oferta del nivel medio.' },
            { letter: 'I', type: 'EMPIEZA', answer: 'INSTITUTO', clue: 'Primera palabra que integra la sigla IEM.' },
            { letter: 'J', type: 'EMPIEZA', answer: 'JOAQUIN', clue: 'Nombre del pasaje/calle donde se ubica el acceso principal al edificio del IEM.' },
            { letter: 'K', type: 'CONTIENE', answer: 'KILOMETRO', clue: 'Unidad de medida empleada para indicar la distancia entre la sede del IEM y el centro de la ciudad.' },
            { letter: 'L', type: 'EMPIEZA', answer: 'LECTIVO', clue: 'Término que califica al período o año académico de desarrollo de clases presenciales.' },
            { letter: 'M', type: 'EMPIEZA', answer: 'MERENDERO', clue: 'Espacio donde comen los estudiantes.' },
            { letter: 'N', type: 'EMPIEZA', answer: 'NACIONAL', clue: 'Carácter estatal de la Universidad (UNSa) a la cual está adscripto el colegio.' },
            { letter: 'Ñ', type: 'CONTIENE', answer: 'OÑATIVIA', clue: 'Apellido del médico y político salteño cuyo legado da nombre oficial al instituto.' },
            { letter: 'O', type: 'EMPIEZA', answer: 'ORIENTACION', clue: 'Gabinete institucional de acompañamiento psicopedagógico y tutoría del estudiante.' },
            { letter: 'P', type: 'EMPIEZA', answer: 'PINEL', clue: 'Apellido del Vicedirector turno mañana.' },
            { letter: 'Q', type: 'EMPIEZA', answer: 'QUIMICA', clue: 'Asignatura clave del área de Ciencias Naturales dictada en los laboratorios del IEM.' },
            { letter: 'R', type: 'EMPIEZA', answer: 'REGLAMENTO', clue: 'Normativa institucional y marco de convivencia que rige los derechos y deberes escolares.' },
            { letter: 'S', type: 'EMPIEZA', answer: 'SERGIO', clue: 'Nombre del Director del IEM.' },
            { letter: 'T', type: 'EMPIEZA', answer: 'TARTAGAL', clue: 'Ciudad del norte provincial donde funciona la sede hermana del IEM dependiente de la UNSa.' },
            { letter: 'U', type: 'EMPIEZA', answer: 'UNSA', clue: 'Sigla de la Universidad Nacional de Salta, institución madre del colegio.' },
            { letter: 'V', type: 'EMPIEZA', answer: 'VACANTES', clue: 'Cupos o plazas disponibles para el ingreso a primer año que se asignan por sorteo público.' },
            { letter: 'W', type: 'CONTIENE', answer: 'WEB', clue: 'Portal digital institucional (iem.unsa.edu.ar) donde se comunican noticias e inscripciones.' },
            { letter: 'X', type: 'CONTIENE', answer: 'EXAMEN', clue: 'Instancia formal de evaluación integradora para comprobar los aprendizajes de los estudiantes.' },
            { letter: 'Y', type: 'CONTIENE', answer: 'YODO', clue: 'Nutriente esencial agregado a la sal promovido por Oñativia para erradicar el bocio endémico.' },
            { letter: 'Z', type: 'CONTIENE', answer: 'ORGANIZACION', clue: 'Estructura participativa y democrática que ejercen los alumnos a través del Centro de Estudiantes.' }
        ];

        // Función para normalizar cadenas (quitar tildes y espacios extras)
        const cleanText = (str) => {
            if (!str) return '';
            return str
                .toLowerCase()
                .trim()
                .replace(/[áäàâ]/g, 'a')
                .replace(/[éëèê]/g, 'e')
                .replace(/[íïìî]/g, 'i')
                .replace(/[óöòô]/g, 'o')
                .replace(/[úüùû]/g, 'u');
        };

        // Sintetizador de efectos de sonido Web Audio API
        const playSound = (type, isMuted) => {
            if (isMuted) return;
            try {
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                if (!AudioCtx) return;
                const ctx = new AudioCtx();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);

                if (type === 'correct') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(523.25, ctx.currentTime);
                    osc.frequency.setValueAtTime(659.25, ctx.currentTime + 0.08);
                    osc.frequency.setValueAtTime(783.99, ctx.currentTime + 0.16);
                    gain.gain.setValueAtTime(0.2, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.35);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.35);
                } else if (type === 'wrong') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(220, ctx.currentTime);
                    osc.frequency.setValueAtTime(140, ctx.currentTime + 0.12);
                    gain.gain.setValueAtTime(0.25, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.35);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.35);
                } else if (type === 'pasapalabra') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(440, ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.15);
                    gain.gain.setValueAtTime(0.2, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.2);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.2);
                }
            } catch (e) {
                console.error("Audio error:", e);
            }
        };

        function App() {
            const INITIAL_TIME = 240; // 4 minutos
            const [gameState, setGameState] = useState('PLAYING'); // 'PLAYING', 'FINISHED'
            const [items, setItems] = useState(() => 
                ROSCO_DATA.map(item => ({ ...item, status: 'pending', userAns: '' }))
            );
            const [currentIndex, setCurrentIndex] = useState(0);
            const [inputVal, setInputVal] = useState('');
            const [timeLeft, setTimeLeft] = useState(INITIAL_TIME);
            const [isPaused, setIsPaused] = useState(false);
            const [isMuted, setIsMuted] = useState(false);
            const [stats, setStats] = useState({ correct: 0, wrong: 0, pending: ROSCO_DATA.length });
            
            const inputRef = useRef(null);

            // Focus automático al campo de texto al cambiar de turno
            useEffect(() => {
                if (gameState === 'PLAYING' && inputRef.current && !isPaused) {
                    inputRef.current.focus();
                }
            }, [currentIndex, gameState, isPaused]);

            // Manejador del temporizador
            useEffect(() => {
                if (gameState !== 'PLAYING' || isPaused) return;

                const timer = setInterval(() => {
                    setTimeLeft(prev => {
                        if (prev <= 1) {
                            clearInterval(timer);
                            finishGame();
                            return 0;
                        }
                        return prev - 1;
                    });
                }, 1000);

                return () => clearInterval(timer);
            }, [gameState, isPaused]);

            // Actualizar estadísticas cada vez que cambia el estado de los items
            useEffect(() => {
                const correctCount = items.filter(i => i.status === 'correct').length;
                const wrongCount = items.filter(i => i.status === 'wrong').length;
                const pendingCount = items.filter(i => i.status === 'pending').length;

                setStats({ correct: correctCount, wrong: wrongCount, pending: pendingCount });

                // Verificar si ya se completaron todas las preguntas
                if (pendingCount === 0 && gameState === 'PLAYING') {
                    finishGame();
                }
            }, [items]);

            const finishGame = () => {
                setGameState('FINISHED');
            };

            const restartGame = () => {
                setItems(ROSCO_DATA.map(item => ({ ...item, status: 'pending', userAns: '' })));
                setCurrentIndex(0);
                setInputVal('');
                setTimeLeft(INITIAL_TIME);
                setIsPaused(false);
                setGameState('PLAYING');
            };

            // Encontrar el siguiente índice con estado 'pending'
            const findNextIndex = (fromIdx) => {
                const total = items.length;
                for (let step = 1; step <= total; step++) {
                    const idx = (fromIdx + step) % total;
                    if (items[idx].status === 'pending') {
                        return idx;
                    }
                }
                return -1; // No hay pendientes
            };

            // Procesar respuesta enviada
            const handleSubmit = (e) => {
                if (e) e.preventDefault();
                if (gameState !== 'PLAYING' || isPaused) return;

                const currentItem = items[currentIndex];
                const cleanInput = cleanText(inputVal);
                const cleanAnswer = cleanText(currentItem.answer);

                if (!cleanInput) {
                    handlePasapalabra();
                    return;
                }

                // Aceptar coincidencia exacta o sin tildes/variantes simples
                const isRight = cleanInput === cleanAnswer || 
                                (cleanAnswer.includes('ñ') && cleanInput === cleanAnswer.replace(/ñ/g, 'n'));

                const updatedItems = [...items];
                updatedItems[currentIndex] = {
                    ...currentItem,
                    status: isRight ? 'correct' : 'wrong',
                    userAns: inputVal.trim()
                };

                setItems(updatedItems);
                setInputVal('');

                if (isRight) {
                    playSound('correct', isMuted);
                } else {
                    playSound('wrong', isMuted);
                }

                const nextIdx = findNextIndex(currentIndex);
                if (nextIdx !== -1) {
                    setCurrentIndex(nextIdx);
                } else {
                    finishGame();
                }
            };

            // Pasar palabra
            const handlePasapalabra = () => {
                if (gameState !== 'PLAYING' || isPaused) return;
                
                playSound('pasapalabra', isMuted);
                setInputVal('');

                const nextIdx = findNextIndex(currentIndex);
                if (nextIdx !== -1) {
                    setCurrentIndex(nextIdx);
                }
            };

            const formatTime = (secs) => {
                const m = Math.floor(secs / 60);
                const s = secs % 60;
                return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
            };

            const currentItem = items[currentIndex] || items[0];

            return (
                <div className="flex flex-col min-h-screen justify-between p-3 md:p-6 max-w-6xl mx-auto w-full">
                    
                    {/* BARRA SUPERIOR / ENCABEZADO */}
                    <header className="glass-panel rounded-2xl p-4 mb-4 shadow-2xl flex flex-wrap items-center justify-between gap-4">
                        <div className="flex items-center gap-3">
                            <div className="bg-gradient-to-tr from-indigo-600 to-sky-400 w-12 h-12 rounded-xl flex items-center justify-center text-white text-2xl font-black shadow-lg">
                                <i className="fa-solid font-bold text-xl">IEM</i>
                            </div>
                            <div>
                                <h1 className="text-xl md:text-2xl font-black tracking-tight text-white flex items-center gap-2">
                                    ROSCO DEL IEM SALTA
                                    <span className="text-xs font-semibold px-2.5 py-0.5 rounded-full bg-indigo-500/30 text-indigo-300 border border-indigo-500/40">
                                        UNSa
                                    </span>
                                </h1>
                                <p className="text-xs text-slate-400">
                                    Instituto de Educación Media "Dr. Arturo Oñativia"
                                </p>
                            </div>
                        </div>

                        {/* Marcadores de Estadísticas */}
                        <div className="flex items-center gap-2 sm:gap-4 flex-wrap">
                            <div className="bg-emerald-950/60 border border-emerald-500/30 px-3 py-1.5 rounded-xl flex items-center gap-2">
                                <i className="fa-solid fa-circle-check text-emerald-400 text-lg"></i>
                                <div>
                                    <div className="text-[10px] text-emerald-300/80 uppercase font-bold tracking-wider">Aciertos</div>
                                    <div className="text-lg font-black text-emerald-400 leading-none">{stats.correct}</div>
                                </div>
                            </div>

                            <div className="bg-rose-950/60 border border-rose-500/30 px-3 py-1.5 rounded-xl flex items-center gap-2">
                                <i className="fa-solid fa-circle-xmark text-rose-400 text-lg"></i>
                                <div>
                                    <div className="text-[10px] text-rose-300/80 uppercase font-bold tracking-wider">Errores</div>
                                    <div className="text-lg font-black text-rose-400 leading-none">{stats.wrong}</div>
                                </div>
                            </div>

                            <div className="bg-amber-950/60 border border-amber-500/30 px-3 py-1.5 rounded-xl flex items-center gap-2">
                                <i className="fa-solid fa-clock text-amber-400 text-lg"></i>
                                <div>
                                    <div className="text-[10px] text-amber-300/80 uppercase font-bold tracking-wider">Tiempo</div>
                                    <div className="text-lg font-black text-amber-300 font-mono leading-none">{formatTime(timeLeft)}</div>
                                </div>
                            </div>

                            <button 
                                onClick={() => setIsMuted(!isMuted)} 
                                className="p-2.5 rounded-xl bg-slate-800/80 border border-slate-700 hover:bg-slate-700 text-slate-300 transition"
                                title={isMuted ? "Activar Sonido" : "Silenciar"}
                            >
                                <i className={`fa-solid ${isMuted ? 'fa-volume-xmark text-rose-400' : 'fa-volume-high text-sky-400'}`}></i>
                            </button>
                        </div>
                    </header>

                    {/* CONTENIDO PRINCIPAL: ROSCO + PANEL DE PREGUNTAS */}
                    {gameState === 'PLAYING' && (
                        <main className="grid grid-cols-1 lg:grid-cols-12 gap-6 items-center my-auto py-2">
                            
                            {/* COLUMNA IZQUIERDA: EL ROSCO (RUEDA CIRCULAR) */}
                            <div className="lg:col-span-6 flex justify-center items-center">
                                <div className="relative w-[320px] h-[320px] sm:w-[420px] sm:h-[420px] md:w-[460px] md:h-[460px] flex items-center justify-center">
                                    
                                    {/* Centro del Rosco con la Letra Actual */}
                                    <div className="absolute w-36 h-36 sm:w-44 sm:h-44 md:w-52 md:h-52 rounded-full glass-panel flex flex-col items-center justify-center shadow-2xl border border-indigo-500/30 p-4 text-center z-10">
                                        <div className="text-xs uppercase font-bold tracking-widest text-sky-400 mb-1">
                                            {currentItem.type === 'EMPIEZA' ? 'Empieza con' : 'Contiene la'}
                                        </div>
                                        <div className="text-5xl sm:text-6xl md:text-7xl font-black text-transparent bg-clip-text bg-gradient-to-b from-amber-300 to-amber-500 drop-shadow-md">
                                            {currentItem.letter}
                                        </div>
                                        <div className="mt-2 text-[11px] text-slate-400 font-medium">
                                            Pregunta {currentIndex + 1} de {items.length}
                                        </div>
                                    </div>

                                    {/* Nodos circulares de cada letra */}
                                    {items.map((item, idx) => {
                                        const total = items.length;
                                        // Ángulo en radianes para posicionar alrededor del círculo (empieza arriba a -90°)
                                        const angle = ((idx / total) * 360 - 90) * (Math.PI / 180);
                                        
                                        // Radio adaptativo según el tamaño de la pantalla
                                        const radius = window.innerWidth < 640 ? 125 : window.innerWidth < 768 ? 165 : 185;
                                        const x = radius * Math.cos(angle);
                                        const y = radius * Math.sin(angle);

                                        const isActive = idx === currentIndex;

                                        let bgColor = 'bg-slate-800 text-slate-300 border-slate-600';
                                        if (item.status === 'correct') {
                                            bgColor = 'bg-emerald-500 text-white border-emerald-300 shadow-lg shadow-emerald-500/40';
                                        } else if (item.status === 'wrong') {
                                            bgColor = 'bg-rose-600 text-white border-rose-300 shadow-lg shadow-rose-600/40';
                                        } else if (isActive) {
                                            bgColor = 'bg-amber-400 text-slate-950 font-black border-white pulse-active';
                                        }

                                        return (
                                            <div
                                                key={item.letter}
                                                style={{
                                                    transform: `translate(${x}px, ${y}px)`,
                                                }}
                                                className={`rosco-node absolute w-8 h-8 sm:w-10 sm:h-10 md:w-11 md:h-11 rounded-full flex items-center justify-center font-bold text-sm sm:text-base md:text-lg border-2 transition-all duration-300 select-none ${bgColor} ${isActive ? 'active' : ''}`}
                                            >
                                                {item.letter}
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>

                            {/* COLUMNA DERECHA: TARJETA DE PREGUNTA Y CONTROLES */}
                            <div className="lg:col-span-6 flex flex-col justify-center">
                                <div className="glass-panel rounded-3xl p-6 sm:p-8 shadow-2xl border border-indigo-500/20 relative overflow-hidden">
                                    <div className="absolute -right-10 -top-10 w-40 h-40 bg-indigo-500/10 rounded-full blur-3xl pointer-events-none"></div>

                                    {/* Indicador de Tipo de Pregunta */}
                                    <div className="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-indigo-900/50 border border-indigo-400/30 text-indigo-300 text-xs font-bold mb-4">
                                        <i className="fa-solid fa-lightbulb text-amber-400"></i>
                                        <span>{currentItem.type === 'EMPIEZA' ? `CON LA LETRA ${currentItem.letter}` : `CONTIENE LA LETRA ${currentItem.letter}`}</span>
                                    </div>

                                    {/* Enunciado de la Pista */}
                                    <p className="text-lg sm:text-xl font-medium text-slate-100 min-h-[90px] flex items-center leading-relaxed">
                                        "{currentItem.clue}"
                                    </p>

                                    {/* Formulario de Entrada */}
                                    <form onSubmit={handleSubmit} className="mt-6 flex flex-col gap-4">
                                        <div className="relative">
                                            <input
                                                ref={inputRef}
                                                type="text"
                                                value={inputVal}
                                                onChange={(e) => setInputVal(e.target.value)}
                                                placeholder="Escribe tu respuesta aquí..."
                                                className="w-full bg-slate-900/90 border-2 border-indigo-500/40 focus:border-amber-400 rounded-2xl px-5 py-4 text-slate-100 placeholder-slate-500 text-lg font-semibold focus:outline-none focus:ring-4 focus:ring-amber-400/20 transition-all shadow-inner"
                                                disabled={isPaused}
                                                autoComplete="off"
                                                spellCheck="false"
                                            />
                                        </div>

                                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                            <button
                                                type="submit"
                                                className="w-full bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-400 hover:to-teal-500 text-white font-bold py-3.5 px-6 rounded-2xl shadow-lg shadow-emerald-600/30 active:scale-95 transition flex items-center justify-center gap-2"
                                            >
                                                <i className="fa-solid fa-paper-plane"></i>
                                                <span>Enviar Respuesta</span>
                                            </button>

                                            <button
                                                type="button"
                                                onClick={handlePasapalabra}
                                                className="w-full bg-gradient-to-r from-amber-500 to-orange-600 hover:from-amber-400 hover:to-orange-500 text-slate-950 font-extrabold py-3.5 px-6 rounded-2xl shadow-lg shadow-amber-500/30 active:scale-95 transition flex items-center justify-center gap-2"
                                            >
                                                <i className="fa-solid fa-forward-step"></i>
                                                <span>Pasapalabra</span>
                                            </button>
                                        </div>
                                    </form>

                                    {/* Botones secundarios */}
                                    <div className="mt-6 pt-4 border-t border-slate-700/60 flex items-center justify-between text-xs text-slate-400">
                                        <button 
                                            onClick={() => setIsPaused(!isPaused)} 
                                            className="hover:text-slate-200 transition flex items-center gap-1.5"
                                        >
                                            <i className={`fa-solid ${isPaused ? 'fa-play text-emerald-400' : 'fa-pause text-amber-400'}`}></i>
                                            <span>{isPaused ? 'Reanudar Tiempo' : 'Pausar Juego'}</span>
                                        </button>

                                        <button 
                                            onClick={restartGame} 
                                            className="hover:text-rose-400 transition flex items-center gap-1.5"
                                        >
                                            <i className="fa-solid fa-rotate-right"></i>
                                            <span>Reiniciar Rosco</span>
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </main>
                    )}

                    {/* PANTALLA FINAL DE RESULTADOS */}
                    {gameState === 'FINISHED' && (
                        <main className="my-auto py-6 max-w-4xl mx-auto w-full">
                            <div className="glass-panel rounded-3xl p-6 sm:p-10 shadow-2xl border border-indigo-500/30 text-center">
                                
                                <div className="inline-flex p-4 bg-indigo-500/20 rounded-full text-amber-400 text-4xl mb-4">
                                    <i className="fa-solid fa-trophy"></i>
                                </div>

                                <h2 className="text-3xl sm:text-4xl font-black text-white mb-2">
                                    ¡Juego Finalizado!
                                </h2>
                                <p className="text-slate-300 text-sm mb-6">
                                    Has completado la prueba de conocimientos sobre el IEM Salta "Dr. Arturo Oñativia".
                                </p>

                                {/* Resumen cuantitativo */}
                                <div className="grid grid-cols-3 gap-4 mb-8">
                                    <div className="bg-emerald-950/50 border border-emerald-500/40 p-4 rounded-2xl">
                                        <div className="text-emerald-400 text-3xl font-black">{stats.correct}</div>
                                        <div className="text-xs text-emerald-200 font-semibold uppercase mt-1">Aciertos</div>
                                    </div>
                                    <div className="bg-rose-950/50 border border-rose-500/40 p-4 rounded-2xl">
                                        <div className="text-rose-400 text-3xl font-black">{stats.wrong}</div>
                                        <div className="text-xs text-rose-200 font-semibold uppercase mt-1">Errores</div>
                                    </div>
                                    <div className="bg-indigo-950/50 border border-indigo-500/40 p-4 rounded-2xl">
                                        <div className="text-indigo-300 text-3xl font-black">
                                            {Math.round((stats.correct / ROSCO_DATA.length) * 100)}%
                                        </div>
                                        <div className="text-xs text-indigo-200 font-semibold uppercase mt-1">Efectividad</div>
                                    </div>
                                </div>

                                {/* Tabla de revisión de soluciones */}
                                <div className="text-left mb-8">
                                    <h3 className="text-lg font-bold text-white mb-3 flex items-center gap-2">
                                        <i className="fa-solid fa-list-check text-sky-400"></i>
                                        <span>Revisión de Respuestas ({ROSCO_DATA.length} letras)</span>
                                    </h3>

                                    <div className="max-h-80 overflow-y-auto rounded-2xl border border-slate-700 bg-slate-900/80 p-2 divide-y divide-slate-800">
                                        {items.map((item) => (
                                            <div key={item.letter} className="p-3 flex flex-col sm:flex-row sm:items-center justify-between gap-2">
                                                <div className="flex items-start gap-3">
                                                    <span className={`w-8 h-8 rounded-lg flex items-center justify-center font-black text-sm shrink-0 ${
                                                        item.status === 'correct' ? 'bg-emerald-500 text-white' : 
                                                        item.status === 'wrong' ? 'bg-rose-600 text-white' : 'bg-slate-700 text-slate-300'
                                                    }`}>
                                                        {item.letter}
                                                    </span>
                                                    <div>
                                                        <div className="text-xs font-semibold text-slate-400">
                                                            {item.type === 'EMPIEZA' ? 'Empieza con' : 'Contiene'} {item.letter} • {item.clue}
                                                        </div>
                                                        <div className="text-sm font-bold text-emerald-400 mt-0.5">
                                                            Solución: {item.answer}
                                                        </div>
                                                    </div>
                                                </div>

                                                <div className="text-xs text-right shrink-0">
                                                    {item.status === 'correct' ? (
                                                        <span className="text-emerald-400 font-bold flex items-center gap-1 justify-end">
                                                            <i className="fa-solid fa-check"></i> ¡Correcto!
                                                        </span>
                                                    ) : item.status === 'wrong' ? (
                                                        <span className="text-rose-400 font-medium">
                                                            Tu respuesta: <span className="underline italic">{item.userAns || '(En blanco)'}</span>
                                                        </span>
                                                    ) : (
                                                        <span className="text-amber-400 font-medium">Pasapalabra (Sin responder)</span>
                                                    )}
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>

                                <button
                                    onClick={restartGame}
                                    className="bg-gradient-to-r from-indigo-500 to-sky-500 hover:from-indigo-400 hover:to-sky-400 text-white font-extrabold px-8 py-4 rounded-2xl shadow-xl shadow-indigo-500/30 active:scale-95 transition text-lg"
                                >
                                    <i className="fa-solid fa-rotate-right mr-2"></i> Jugar Nuevo Rosco
                                </button>
                            </div>
                        </main>
                    )}

                    {/* PIE DE PÁGINA */}
                    <footer className="text-center text-xs text-slate-500 py-3 border-t border-slate-800/60 mt-4">
                        Juego educativo interactivo sobre el Instituto de Educación Media "Dr. Arturo Oñativia" • Universidad Nacional de Salta (UNSa)
                    </footer>

                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
