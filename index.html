<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pasapalabras - IEM (UNSa)</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <!-- Babel compiler for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <!-- Favicon: logo del IEM -->
    <link rel="icon" type="image/png" href="logo-iem-sin-fondo.png">

    <style>
        :root {
            /* Gama pastel derivada del verde institucional #258543 */
            --iem: #258543;
            --iem-deep: #14572c;
            --pastel-1: #f1faf4;   /* casi blanco verdoso */
            --pastel-2: #cdecda;   /* menta suave */
            --pastel-3: #9bdcb6;   /* menta pastel (centro del degradé) */
            --mint: #a9e5c3;
            --lemon: #ffeaa8;
            --blush: #ffc9d3;
            --ink: #14492c;        /* texto principal */
            --ink-soft: #3f7a58;   /* texto secundario */
        }

        body {
            font-family: 'Outfit', sans-serif;
            /* Degradé HORIZONTAL pastel sobre la gama del verde #258543 */
            background: linear-gradient(90deg,
                var(--pastel-1) 0%,
                var(--pastel-2) 22%,
                var(--pastel-3) 50%,
                var(--pastel-2) 78%,
                var(--pastel-1) 100%);
            background-size: 220% 100%;
            background-attachment: fixed;
            animation: bg-slide 24s ease-in-out infinite alternate;
            color: var(--ink);
            min-height: 100vh;
            overflow-x: hidden;
        }

        @keyframes bg-slide {
            from { background-position: 0% 50%; }
            to   { background-position: 100% 50%; }
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.78);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(37, 133, 67, 0.18);
        }

        /* Sombras suaves verdosas (reemplazan a las negras de Tailwind) */
        .shadow-soft { box-shadow: 0 14px 38px rgba(20, 73, 44, 0.13); }

        /* ---------- ENTRADAS ANIMADAS ---------- */
        @keyframes fade-up {
            from { opacity: 0; transform: translateY(28px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        .anim-in   { animation: fade-up .75s cubic-bezier(.2,.85,.25,1) both; }
        .delay-1   { animation-delay: .12s; }
        .delay-2   { animation-delay: .26s; }
        .delay-3   { animation-delay: .40s; }

        @keyframes zoom-in {
            0%   { opacity: 0; transform: scale(.75); }
            70%  { transform: scale(1.06); }
            100% { opacity: 1; transform: scale(1); }
        }
        .anim-zoom { animation: zoom-in .6s cubic-bezier(.2,.9,.3,1.3) both; }

        /* ---------- LOGO IEM ---------- */
        .logo-badge {
            position: relative;
            background: linear-gradient(135deg, #ffffff 0%, var(--pastel-2) 45%, var(--mint) 100%);
            border: 2px solid rgba(37, 133, 67, .22);
            box-shadow: 0 8px 20px rgba(20, 73, 44, .16), inset 0 1px 0 rgba(255,255,255,.9);
            animation: float 3.6s ease-in-out infinite;
            transition: transform .35s cubic-bezier(.2,.9,.3,1.4), box-shadow .35s;
        }
        .logo-badge:hover {
            transform: scale(1.14) rotate(-8deg);
            box-shadow: 0 0 20px var(--mint), 0 0 40px rgba(169, 229, 195, .8);
        }
        .logo-badge img {
            width: 76%;
            height: 76%;
            object-fit: contain;
            display: block;
        }
        .logo-ring {
            position: absolute;
            inset: -5px;
            border: 2px dashed rgba(37, 133, 67, .40);
            border-radius: 1.1rem;
            animation: spin 9s linear infinite;
            pointer-events: none;
        }
        @keyframes float {
            0%,100% { transform: translateY(0); }
            50%     { transform: translateY(-6px); }
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ---------- ROSCO ---------- */
        .node-slot { animation: node-appear .5s ease-out both; }
        @keyframes node-appear {
            from { opacity: 0; }
            to   { opacity: 1; }
        }

        .rosco-node {
            transition: transform .35s cubic-bezier(.2,.9,.3,1.5), background-color .3s, box-shadow .3s, color .3s;
        }
        .rosco-node.active {
            transform: scale(1.35);
            z-index: 30;
        }
        .node-pop { animation: node-pop .55s cubic-bezier(.2,.9,.3,1.6); }
        @keyframes node-pop {
            0%   { transform: scale(1); }
            45%  { transform: scale(1.55) rotate(12deg); }
            100% { transform: scale(1); }
        }
        .node-fail { animation: node-fail .5s ease-in-out; }
        @keyframes node-fail {
            0%,100% { transform: translateX(0); }
            25%     { transform: translateX(-5px) rotate(-6deg); }
            75%     { transform: translateX(5px) rotate(6deg); }
        }

        .pulse-active { animation: pulse-glow 1.4s infinite alternate; }
        @keyframes pulse-glow {
            0%   { box-shadow: 0 0 8px rgba(255, 213, 128, .85), 0 0 14px rgba(255, 213, 128, .45); }
            100% { box-shadow: 0 0 20px rgba(255, 196, 87, .95), 0 0 36px rgba(255, 213, 128, .75); }
        }

        /* Aros decorativos giratorios */
        .rosco-ring {
            position: absolute;
            inset: 4%;
            border-radius: 9999px;
            border: 2px dashed rgba(37, 133, 67, .28);
            animation: spin 38s linear infinite;
            pointer-events: none;
        }
        .rosco-ring.reverse {
            inset: 14%;
            border-style: dotted;
            border-color: rgba(255, 196, 87, .45);
            animation: spin 26s linear infinite reverse;
        }
        .rosco-halo {
            position: absolute;
            inset: -8%;
            border-radius: 9999px;
            background: radial-gradient(circle, rgba(169, 229, 195, .55) 0%, rgba(169, 229, 195, 0) 65%);
            animation: breathe 5s ease-in-out infinite;
            pointer-events: none;
        }
        @keyframes breathe {
            0%,100% { transform: scale(1);    opacity: .6; }
            50%     { transform: scale(1.09); opacity: 1; }
        }

        /* ---------- LETRA CENTRAL ---------- */
        .letter-flip { animation: letter-flip .55s cubic-bezier(.2,.9,.3,1.4); }
        @keyframes letter-flip {
            0%   { transform: rotateX(-90deg) scale(.6); opacity: 0; }
            100% { transform: rotateX(0) scale(1); opacity: 1; }
        }

        /* ---------- FEEDBACK DE LA TARJETA ---------- */
        .flash-correct { animation: flash-correct .7s ease-out; }
        @keyframes flash-correct {
            0%   { box-shadow: 0 0 0 0 rgba(109, 210, 155, .9); border-color: rgba(109, 210, 155, 1); }
            50%  { box-shadow: 0 0 40px 12px rgba(169, 229, 195, .85); }
            100% { box-shadow: 0 0 0 0 rgba(169, 229, 195, 0); }
        }
        .flash-wrong { animation: flash-wrong .6s ease-in-out; }
        @keyframes flash-wrong {
            0%,100% { transform: translateX(0); }
            15%     { transform: translateX(-11px); }
            30%     { transform: translateX(9px); }
            45%     { transform: translateX(-7px); }
            60%     { transform: translateX(5px); }
            80%     { transform: translateX(-3px); }
        }

        /* Cartel flotante de acierto / error */
        .toast-fx {
            position: absolute;
            top: 12px; right: 18px;
            font-weight: 900;
            font-size: 1.4rem;
            pointer-events: none;
            animation: toast-up 1.1s ease-out forwards;
            text-shadow: 0 2px 8px rgba(255,255,255,.9);
        }
        @keyframes toast-up {
            0%   { opacity: 0; transform: translateY(14px) scale(.7); }
            25%  { opacity: 1; transform: translateY(0) scale(1.15); }
            70%  { opacity: 1; transform: translateY(-10px) scale(1); }
            100% { opacity: 0; transform: translateY(-38px) scale(.9); }
        }

        /* ---------- BOTONES ---------- */
        .btn-fx {
            position: relative;
            overflow: hidden;
            transition: transform .2s cubic-bezier(.2,.9,.3,1.5), box-shadow .25s, filter .25s;
        }
        .btn-fx:hover  { transform: translateY(-4px) scale(1.03); filter: brightness(1.04) saturate(1.15); }
        .btn-fx:active { transform: translateY(0) scale(.96); }
        .btn-fx::after {
            content: '';
            position: absolute;
            top: 0; left: -140%;
            width: 60%; height: 100%;
            background: linear-gradient(120deg, transparent, rgba(255,255,255,.85), transparent);
            transform: skewX(-22deg);
            transition: left .7s ease;
        }
        .btn-fx:hover::after { left: 150%; }

        /* ---------- TIEMPO CRÍTICO ---------- */
        .time-critical { animation: heartbeat 1s ease-in-out infinite; color: #e11d48 !important; }
        @keyframes heartbeat {
            0%,100% { transform: scale(1); }
            25%     { transform: scale(1.22); }
            50%     { transform: scale(1); }
        }

        /* ---------- INPUT ---------- */
        .input-fx { transition: box-shadow .3s, border-color .3s, transform .25s; }
        .input-fx:focus { transform: scale(1.02); }

        /* ---------- CARTEL DEL DÍA DEL ESTUDIANTE ---------- */
        .party-banner {
            position: relative;
            overflow: hidden;
            text-align: center;
            background: linear-gradient(100deg, var(--lemon) 0%, var(--blush) 32%, var(--pastel-2) 66%, var(--mint) 100%);
            background-size: 200% 100%;
            animation: party-shift 7s ease-in-out infinite alternate;
            border: 2px dashed rgba(37, 133, 67, .35);
            box-shadow: 0 10px 28px rgba(20, 73, 44, .12);
        }
        @keyframes party-shift {
            from { background-position: 0% 50%; }
            to   { background-position: 100% 50%; }
        }
        .party-banner::after {
            content: '';
            position: absolute;
            top: 0; left: -60%;
            width: 40%; height: 100%;
            background: linear-gradient(110deg, transparent, rgba(255,255,255,.75), transparent);
            transform: skewX(-20deg);
            animation: party-shine 4.5s ease-in-out infinite;
            pointer-events: none;
        }
        @keyframes party-shine {
            0%, 65% { left: -60%; }
            100%    { left: 130%; }
        }
        .party-emoji {
            display: inline-block;
            animation: party-bounce 1.5s ease-in-out infinite;
        }
        @keyframes party-bounce {
            0%,100% { transform: translateY(0) rotate(-8deg); }
            50%     { transform: translateY(-10px) rotate(8deg); }
        }

        /* ---------- TROFEO + CONFETI ---------- */
        .trophy-fx { animation: trophy-bounce 1.6s ease-in-out infinite; }
        @keyframes trophy-bounce {
            0%,100% { transform: translateY(0) rotate(-6deg); }
            50%     { transform: translateY(-14px) rotate(6deg); }
        }
        .confetti {
            position: fixed;
            top: -12vh;
            width: 11px; height: 16px;
            opacity: .9;
            z-index: 50;
            pointer-events: none;
            animation: confetti-fall linear forwards;
        }
        @keyframes confetti-fall {
            0%   { transform: translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(118vh) rotate(760deg); opacity: 0; }
        }

        /* Barra de progreso animada */
        .progress-bar {
            transition: width .6s cubic-bezier(.2,.9,.3,1);
            background: linear-gradient(90deg, var(--mint), #ffd98a);
            box-shadow: 0 0 10px rgba(169, 229, 195, .9);
        }

        /* Scrollbar pastel en la revisión final */
        .pastel-scroll::-webkit-scrollbar { width: 10px; }
        .pastel-scroll::-webkit-scrollbar-track { background: var(--pastel-1); border-radius: 9999px; }
        .pastel-scroll::-webkit-scrollbar-thumb { background: var(--pastel-3); border-radius: 9999px; }

        /* ---------- PIE DE PÁGINA (festivo, pero discreto) ---------- */
        .footer-fest {
            position: relative;
            background: linear-gradient(100deg, rgba(255,255,255,.60), rgba(226,244,234,.55));
            border: 2px dashed rgba(37, 133, 67, .35);
        }

        /* Guirnalda de iconos: apenas se mueve */
        .footer-garland {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: .85rem;
            font-size: .95rem;
            margin-bottom: .5rem;
            opacity: .9;
        }
        .garland-item {
            display: inline-block;
            animation: garland-wave 4.5s ease-in-out infinite;
            transition: transform .3s ease, filter .3s ease;
        }
        .garland-item:hover { transform: scale(1.25); filter: brightness(1.15); }
        .garland-item:nth-child(1) { color: #258543; } /* birrete  - verde IEM */
        .garland-item:nth-child(2) { color: #d6567a; } /* libro    - rosa      */
        .garland-item:nth-child(3) { color: #e0921f; } /* lamparita- ámbar     */
        .garland-item:nth-child(4) { color: #3d9ad1; } /* estrella - celeste   */
        .garland-item:nth-child(5) { color: #7a5cc4; } /* lápiz    - violeta   */
        @keyframes garland-wave {
            0%,100% { transform: translateY(0); }
            50%     { transform: translateY(-3px); }
        }

        /* Saludo del Día del Estudiante */
        .footer-title {
            font-weight: 800;
            color: var(--iem-deep);
            letter-spacing: -.01em;
        }

        /* Accesibilidad: menos movimiento */
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: .01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: .01ms !important;
            }
        }
    </style>
</head>
<body class="flex flex-col justify-between min-h-screen selection:bg-emerald-200 selection:text-emerald-900">

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // Base de preguntas del Rosco del IEM Salta
        const ROSCO_DATA = [
            { letter: 'A', type: 'EMPIEZA', answer: 'ARTURO', clue: 'Nombre del insigne médico salteño y exministro de Salud de la Nación que da nombre al IEM.' },
            { letter: 'B', type: 'EMPIEZA', answer: 'BOLIVIA', clue: 'Avenida (N° 5150) sobre la cual se ubica el predio de la UNSa donde se encuentra el colegio.' },
            { letter: 'C', type: 'EMPIEZA', answer: 'CASTAÑARES', clue: 'Barrio y predio universitario en la zona norte de Salta donde funciona el IEM.' },
            { letter: 'D', type: 'EMPIEZA', answer: 'DIRECTOR', clue: 'Cargo unipersonal de máxima autoridad ejecutiva y pedagógica del instituto.' },
            { letter: 'E', type: 'EMPIEZA', answer: 'ESTUDIANTES', clue: 'Jóvenes que transitan sus 6 años de formación secundaria en las aulas del colegio.' },
            { letter: 'F', type: 'EMPIEZA', answer: 'FORMULACION', clue: 'Primera palabra clave del título de grado: Bachiller en ________ y Evaluación de Proyectos.' },
            { letter: 'G', type: 'EMPIEZA', answer: 'GABRIELA', clue: 'Nombre de la Vicedirectora turno tarde.' },
            { letter: 'H', type: 'EMPIEZA', answer: 'HUMANIDADES', clue: 'Área del conocimiento y orientaciones sociales destacadas en la oferta del nivel medio.' },
            { letter: 'I', type: 'EMPIEZA', answer: 'INSTITUTO', clue: 'Primera palabra que integra la sigla IEM.' },
            { letter: 'J', type: 'EMPIEZA', answer: 'JOAQUIN', clue: 'Nombre del pasaje/calle donde se ubica el acceso principal al edificio del IEM.' },
            { letter: 'K', type: 'CONTIENE', answer: 'KILOMETRO', clue: 'Unidad de medida empleada para indicar la distancia entre la sede del IEM y el centro de la ciudad.' },
            { letter: 'L', type: 'EMPIEZA', answer: 'LECTIVO', clue: 'Término que califica al período o año académico de desarrollo de clases presenciales.' },
            { letter: 'M', type: 'EMPIEZA', answer: 'MERENDERO', clue: 'Espacio donde comen los estudiantes.' },
            { letter: 'N', type: 'EMPIEZA', answer: 'NACIONAL', clue: 'Carácter estatal de la Universidad (UNSa) a la cual está adscripto el colegio.' },
            { letter: 'Ñ', type: 'CONTIENE', answer: 'OÑATIVIA', clue: 'Apellido del médico y político salteño cuyo legado da nombre oficial al instituto.' },
            { letter: 'O', type: 'EMPIEZA', answer: 'ORIENTACION', clue: 'Gabinete institucional de acompañamiento psicopedagógico y tutoría del estudiante.' },
            { letter: 'P', type: 'EMPIEZA', answer: 'PINEL', clue: 'Apellido del Vicedirector turno mañana.' },
            { letter: 'Q', type: 'EMPIEZA', answer: 'QUIMICA', clue: 'Asignatura clave del área de Ciencias Naturales dictada en los laboratorios del IEM.' },
            { letter: 'R', type: 'EMPIEZA', answer: 'REGLAMENTO', clue: 'Normativa institucional y marco de convivencia que rige los derechos y deberes escolares.' },
            { letter: 'S', type: 'EMPIEZA', answer: 'SERGIO', clue: 'Nombre del Director del IEM.' },
            { letter: 'T', type: 'EMPIEZA', answer: 'TARTAGAL', clue: 'Ciudad del norte provincial donde funciona la sede hermana del IEM dependiente de la UNSa.' },
            { letter: 'U', type: 'EMPIEZA', answer: 'UNSA', clue: 'Sigla de la Universidad Nacional de Salta, institución madre del colegio.' },
            { letter: 'V', type: 'EMPIEZA', answer: 'VACANTES', clue: 'Cupos o plazas disponibles para el ingreso a primer año que se asignan por sorteo público.' },
            { letter: 'W', type: 'CONTIENE', answer: 'WEB', clue: 'Portal digital institucional (iem.unsa.edu.ar) donde se comunican noticias e inscripciones.' },
            { letter: 'X', type: 'CONTIENE', answer: 'EXAMEN', clue: 'Instancia formal de evaluación integradora para comprobar los aprendizajes de los estudiantes.' },
            { letter: 'Y', type: 'CONTIENE', answer: 'YODO', clue: 'Nutriente esencial agregado a la sal promovido por Oñativia para erradicar el bocio endémico.' },
            { letter: 'Z', type: 'CONTIENE', answer: 'ORGANIZACION', clue: 'Estructura participativa y democrática que ejercen los alumnos a través del Centro de Estudiantes.' }
        ];

        // PUNTAJE: todas las palabras del rosco valen exactamente lo mismo.
        // Cambiando PUNTOS_POR_LETRA se recalcula automáticamente el total.
        const PUNTOS_POR_LETRA = 10;
        // Duración de la animación de respuesta: hasta que termina no se pasa a la siguiente pregunta
        const DURACION_FEEDBACK = 1100;
        const PUNTAJE_MAXIMO = ROSCO_DATA.length * PUNTOS_POR_LETRA;

        // Bonus por rapidez: el porcentaje de tiempo que sobró se suma sobre el puntaje base.
        // Terminar en la mitad del tiempo = +50%; agotar el reloj = +0%.
        const calcularPuntaje = (aciertos, tiempoRestante, tiempoTotal) => {
            const base = aciertos * PUNTOS_POR_LETRA;
            const porcentaje = Math.max(0, Math.round((tiempoRestante / tiempoTotal) * 100));
            const bonus = Math.round(base * porcentaje / 100);
            return { base, porcentaje, bonus, total: base + bonus };
        };

        // Función para normalizar cadenas (quitar tildes y espacios extras)
        const cleanText = (str) => {
            if (!str) return '';
            return str
                .toLowerCase()
                .trim()
                .replace(/[áäàâ]/g, 'a')
                .replace(/[éëèê]/g, 'e')
                .replace(/[íïìî]/g, 'i')
                .replace(/[óöòô]/g, 'o')
                .replace(/[úüùû]/g, 'u');
        };

        // Sintetizador de efectos de sonido Web Audio API
        const playSound = (type, isMuted) => {
            if (isMuted) return;
            try {
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                if (!AudioCtx) return;
                const ctx = new AudioCtx();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);

                if (type === 'correct') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(523.25, ctx.currentTime);
                    osc.frequency.setValueAtTime(659.25, ctx.currentTime + 0.08);
                    osc.frequency.setValueAtTime(783.99, ctx.currentTime + 0.16);
                    gain.gain.setValueAtTime(0.2, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.35);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.35);
                } else if (type === 'wrong') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(220, ctx.currentTime);
                    osc.frequency.setValueAtTime(140, ctx.currentTime + 0.12);
                    gain.gain.setValueAtTime(0.25, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.35);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.35);
                } else if (type === 'pasapalabra') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(440, ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.15);
                    gain.gain.setValueAtTime(0.2, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.2);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.2);
                }
            } catch (e) {
                console.error("Audio error:", e);
            }
        };

        // Confeti CSS para la pantalla de resultados
        function Confetti({ pieces = 70 }) {
            const colors = ['#a9e5c3', '#ffeaa8', '#ffc9d3', '#bfe8ce', '#cdeafe', '#e3d5ff'];
            const bits = React.useMemo(() => (
                Array.from({ length: pieces }, (_, i) => ({
                    id: i,
                    left: Math.random() * 100,
                    delay: Math.random() * 2.5,
                    duration: 3 + Math.random() * 2.5,
                    color: colors[i % colors.length],
                    round: i % 3 === 0
                }))
            ), [pieces]);

            return (
                <div aria-hidden="true">
                    {bits.map(b => (
                        <span
                            key={b.id}
                            className="confetti"
                            style={{
                                left: b.left + 'vw',
                                backgroundColor: b.color,
                                animationDelay: b.delay + 's',
                                animationDuration: b.duration + 's',
                                borderRadius: b.round ? '50%' : '2px'
                            }}
                        />
                    ))}
                </div>
            );
        }

        // Fanfarria de cierre para el Día del Estudiante
        const playFanfare = (isMuted) => {
            if (isMuted) return;
            try {
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                if (!AudioCtx) return;
                const ctx = new AudioCtx();
                const t0 = ctx.currentTime;

                // Melodía ascendente: Do - Mi - Sol - Do agudo
                const melodia = [
                    { f: 523.25, t: 0.00, d: 0.20 },
                    { f: 659.25, t: 0.17, d: 0.20 },
                    { f: 783.99, t: 0.34, d: 0.20 },
                    { f: 1046.50, t: 0.51, d: 0.50 }
                ];
                melodia.forEach(n => {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(n.f, t0 + n.t);
                    gain.gain.setValueAtTime(0.0001, t0 + n.t);
                    gain.gain.exponentialRampToValueAtTime(0.22, t0 + n.t + 0.03);
                    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + n.t + n.d);
                    osc.connect(gain); gain.connect(ctx.destination);
                    osc.start(t0 + n.t);
                    osc.stop(t0 + n.t + n.d + 0.05);
                });

                // Acorde final sostenido
                [523.25, 659.25, 783.99, 1046.50].forEach(f => {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(f, t0 + 1.0);
                    gain.gain.setValueAtTime(0.0001, t0 + 1.0);
                    gain.gain.exponentialRampToValueAtTime(0.10, t0 + 1.08);
                    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + 2.2);
                    osc.connect(gain); gain.connect(ctx.destination);
                    osc.start(t0 + 1.0);
                    osc.stop(t0 + 2.3);
                });

                setTimeout(() => { try { ctx.close(); } catch (e) {} }, 3000);
            } catch (e) {
                console.error("Audio error:", e);
            }
        };

        // Frases para el cartel del Día del Estudiante
        const FRASES_ESTUDIANTE = [
            'Que nunca se te apague la curiosidad: preguntar es la mejor forma de aprender.',
            'Tu esfuerzo de hoy es el camino que vas a recordar mañana. ¡A seguir!',
            'Aprender también es equivocarse, volver a intentar y divertirse en el camino.',
            'El aula se llena de futuro cada vez que entrás con ganas de saber más.',
            'Sos parte de la historia del IEM: ¡que sea un año para recordar!'
        ];

        function App() {
            const INITIAL_TIME = 420; // 7 minutos
            const [gameState, setGameState] = useState('PLAYING'); // 'PLAYING', 'FINISHED'
            const [items, setItems] = useState(() => 
                ROSCO_DATA.map(item => ({ ...item, status: 'pending', userAns: '' }))
            );
            const [currentIndex, setCurrentIndex] = useState(0);
            const [inputVal, setInputVal] = useState('');
            const [timeLeft, setTimeLeft] = useState(INITIAL_TIME);
            const [isMuted, setIsMuted] = useState(false);
            const [stats, setStats] = useState({ correct: 0, wrong: 0, pending: ROSCO_DATA.length });
            const [flash, setFlash] = useState(null);   // 'correct' | 'wrong' -> animación de feedback
            const [isLocked, setIsLocked] = useState(false); // true mientras se muestra la animación
            const [frase, setFrase] = useState(FRASES_ESTUDIANTE[0]);
            
            const inputRef = useRef(null);
            const feedbackTimer = useRef(null);
            const yaFinalizado = useRef(false); // evita cerrar el juego dos veces

            // Focus automático al campo de texto al cambiar de turno
            useEffect(() => {
                if (gameState === 'PLAYING' && !isLocked && inputRef.current) {
                    // preventScroll evita que la página salte al campo en celulares
                    inputRef.current.focus({ preventScroll: true });
                }
            }, [currentIndex, gameState, isLocked]);

            // Manejador del temporizador
            useEffect(() => {
                if (gameState !== 'PLAYING') return;

                const timer = setInterval(() => {
                    setTimeLeft(prev => {
                        if (prev <= 1) {
                            clearInterval(timer);
                            finishGame();
                            return 0;
                        }
                        return prev - 1;
                    });
                }, 1000);

                return () => clearInterval(timer);
            }, [gameState]);

            // Actualizar estadísticas cada vez que cambia el estado de los items
            useEffect(() => {
                const correctCount = items.filter(i => i.status === 'correct').length;
                const wrongCount = items.filter(i => i.status === 'wrong').length;
                const pendingCount = items.filter(i => i.status === 'pending').length;

                setStats({ correct: correctCount, wrong: wrongCount, pending: pendingCount });
            }, [items]);

            // Limpieza del temporizador de la animación
            useEffect(() => () => clearTimeout(feedbackTimer.current), []);

            const finishGame = () => {
                if (yaFinalizado.current) return;
                yaFinalizado.current = true;
                setFrase(FRASES_ESTUDIANTE[Math.floor(Math.random() * FRASES_ESTUDIANTE.length)]);
                setGameState('FINISHED');
            };

            // Fanfarria al llegar a la pantalla final
            useEffect(() => {
                if (gameState === 'FINISHED') playFanfare(isMuted);
            }, [gameState]);

            const restartGame = () => {
                setItems(ROSCO_DATA.map(item => ({ ...item, status: 'pending', userAns: '' })));
                setCurrentIndex(0);
                setInputVal('');
                setTimeLeft(INITIAL_TIME);
                setFlash(null);
                clearTimeout(feedbackTimer.current);
                setIsLocked(false);
                yaFinalizado.current = false;
                setGameState('PLAYING');
            };

            // Encontrar el siguiente índice con estado 'pending'
            const findNextIndex = (fromIdx, lista = items) => {
                const total = lista.length;
                for (let step = 1; step <= total; step++) {
                    const idx = (fromIdx + step) % total;
                    if (lista[idx].status === 'pending') {
                        return idx;
                    }
                }
                return -1; // No hay pendientes
            };

            // Procesar respuesta enviada
            const handleSubmit = (e) => {
                if (e) e.preventDefault();
                if (gameState !== 'PLAYING' || isLocked) return;

                const currentItem = items[currentIndex];
                const cleanInput = cleanText(inputVal);
                const cleanAnswer = cleanText(currentItem.answer);

                if (!cleanInput) {
                    handlePasapalabra();
                    return;
                }

                // Aceptar coincidencia exacta o sin tildes/variantes simples
                const isRight = cleanInput === cleanAnswer || 
                                (cleanAnswer.includes('ñ') && cleanInput === cleanAnswer.replace(/ñ/g, 'n'));

                const updatedItems = [...items];
                updatedItems[currentIndex] = {
                    ...currentItem,
                    status: isRight ? 'correct' : 'wrong',
                    userAns: inputVal.trim()
                };

                setItems(updatedItems);
                setInputVal('');

                playSound(isRight ? 'correct' : 'wrong', isMuted);

                // Se muestra la animación de feedback y se bloquea el juego mientras dura
                setFlash(isRight ? 'correct' : 'wrong');
                setIsLocked(true);

                // Recién cuando termina la animación se pasa a la siguiente pregunta
                const nextIdx = findNextIndex(currentIndex, updatedItems);
                clearTimeout(feedbackTimer.current);
                feedbackTimer.current = setTimeout(() => {
                    setFlash(null);
                    setIsLocked(false);
                    if (nextIdx !== -1) {
                        setCurrentIndex(nextIdx);
                    } else {
                        finishGame();
                    }
                }, DURACION_FEEDBACK);
            };

            // Pasar palabra
            const handlePasapalabra = () => {
                if (gameState !== 'PLAYING' || isLocked) return;
                
                playSound('pasapalabra', isMuted);
                setInputVal('');

                const nextIdx = findNextIndex(currentIndex);
                if (nextIdx !== -1) {
                    setCurrentIndex(nextIdx);
                }
            };

            const formatTime = (secs) => {
                const m = Math.floor(secs / 60);
                const s = secs % 60;
                return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
            };

            const currentItem = items[currentIndex] || items[0];

            // Puntaje base + bonus por el tiempo que sobró
            const puntaje = calcularPuntaje(stats.correct, timeLeft, INITIAL_TIME);

            return (
                <div className="flex flex-col min-h-screen justify-between p-3 md:p-6 max-w-6xl mx-auto w-full">
                    
                    {/* BARRA SUPERIOR / ENCABEZADO */}
                    <header className="glass-panel rounded-2xl p-4 mb-4 shadow-soft flex flex-wrap items-center justify-between gap-4 anim-in">
                        <div className="flex items-center gap-3">
                            {/* Logo del IEM */}
                            <div className="logo-badge w-14 h-14 rounded-2xl flex items-center justify-center shrink-0">
                                <img src="logo-iem-sin-fondo.png" alt="Logo del Instituto de Educación Media Dr. Arturo Oñativia" />
                                <span className="logo-ring"></span>
                            </div>
                            <div>
                                <h1 className="text-xl md:text-2xl font-black tracking-tight text-emerald-900 flex items-center gap-2">
                                    PASAPALABRA DEL I.E.M
                                    <span className="text-xs font-semibold px-2.5 py-0.5 rounded-full bg-emerald-200/70 text-emerald-800 border border-emerald-400/60">
                                        UNSa
                                    </span>
                                </h1>
                                <a
                                    href="https://iem.unsa.edu.ar/page/2/"
                                    target="_blank"
                                    rel="noopener noreferrer"
                                    className="text-xs text-emerald-700 hover:text-amber-600 transition-colors inline-flex items-center gap-1.5 group"
                                >
                                    Instituto de Educación Media "Dr. Arturo Oñativia"
                                    <i className="fa-solid fa-arrow-up-right-from-square text-[9px] opacity-70 group-hover:translate-x-0.5 group-hover:-translate-y-0.5 transition-transform"></i>
                                </a>
                            </div>
                        </div>

                        {/* Tiempo y sonido */}
                        <div className="flex items-center gap-2 sm:gap-4 flex-wrap">
                            <div className="bg-amber-100 border border-amber-300 px-3 py-1.5 rounded-xl flex items-center gap-2 transition-transform hover:scale-105">
                                <i className="fa-solid fa-clock text-amber-500 text-lg"></i>
                                <div>
                                    <div className="text-[10px] text-amber-700/90 uppercase font-bold tracking-wider">Tiempo</div>
                                    <div className={`text-lg font-black text-amber-700 font-mono leading-none ${timeLeft <= 30 ? 'time-critical' : ''}`}>{formatTime(timeLeft)}</div>
                                </div>
                            </div>

                            <button 
                                onClick={() => setIsMuted(!isMuted)} 
                                className="p-2.5 rounded-xl bg-white/80 border border-emerald-300 hover:bg-emerald-100 hover:scale-110 text-emerald-700 transition-transform duration-300"
                                title={isMuted ? "Activar Sonido" : "Silenciar"}
                            >
                                <i className={`fa-solid ${isMuted ? 'fa-volume-xmark text-rose-500' : 'fa-volume-high text-emerald-600'}`}></i>
                            </button>
                        </div>
                    </header>

                    {/* CONTENIDO PRINCIPAL: ROSCO + PANEL DE PREGUNTAS */}
                    {gameState === 'PLAYING' && (
                        <main className="grid grid-cols-1 lg:grid-cols-12 gap-6 items-center my-auto py-2">
                            
                            {/* COLUMNA IZQUIERDA: EL ROSCO (RUEDA CIRCULAR) */}
                            <div className="lg:col-span-6 flex justify-center items-center">
                                <div className="relative w-[320px] h-[320px] sm:w-[420px] sm:h-[420px] md:w-[460px] md:h-[460px] flex items-center justify-center anim-zoom">

                                    {/* Halo y aros decorativos giratorios */}
                                    <div className="rosco-halo"></div>
                                    <div className="rosco-ring"></div>

                                    {/* Centro del Rosco con la Letra Actual */}
                                    <div className="absolute w-36 h-36 sm:w-44 sm:h-44 md:w-52 md:h-52 rounded-full glass-panel flex flex-col items-center justify-center shadow-soft border border-emerald-300 p-4 text-center z-10">
                                        <div className="text-xs uppercase font-bold tracking-widest text-emerald-600 mb-1">
                                            {currentItem.type === 'EMPIEZA' ? 'Empieza con' : 'Contiene la'}
                                        </div>
                                        <div
                                            key={currentItem.letter}
                                            className="letter-flip text-5xl sm:text-6xl md:text-7xl font-black text-transparent bg-clip-text bg-gradient-to-b from-emerald-500 to-emerald-800 drop-shadow"
                                        >
                                            {currentItem.letter}
                                        </div>
                                        <div className="mt-2 text-[11px] text-emerald-700/90 font-medium">
                                            Pregunta {currentIndex + 1} de {items.length}
                                        </div>
                                        {/* Barra de progreso */}
                                        <div className="mt-2 w-20 h-1.5 rounded-full bg-emerald-100 overflow-hidden">
                                            <div
                                                className="progress-bar h-full rounded-full"
                                                style={{ width: ((stats.correct + stats.wrong) / items.length * 100) + '%' }}
                                            ></div>
                                        </div>
                                    </div>

                                    {/* Nodos circulares de cada letra */}
                                    {items.map((item, idx) => {
                                        const total = items.length;
                                        // Ángulo en radianes para posicionar alrededor del círculo (empieza arriba a -90°)
                                        const angle = ((idx / total) * 360 - 90) * (Math.PI / 180);
                                        
                                        // Radio adaptativo según el tamaño de la pantalla
                                        const radius = window.innerWidth < 640 ? 125 : window.innerWidth < 768 ? 165 : 185;
                                        const x = radius * Math.cos(angle);
                                        const y = radius * Math.sin(angle);

                                        const isActive = idx === currentIndex;

                                        let bgColor = 'bg-white text-emerald-700 border-emerald-200';
                                        let fx = '';
                                        if (item.status === 'correct') {
                                            bgColor = 'bg-emerald-200 text-emerald-900 border-emerald-400 shadow-md shadow-emerald-300/70';
                                            fx = 'node-pop';
                                        } else if (item.status === 'wrong') {
                                            bgColor = 'bg-rose-200 text-rose-800 border-rose-300 shadow-md shadow-rose-200/80';
                                            fx = 'node-fail';
                                        } else if (isActive) {
                                            bgColor = 'bg-amber-200 text-amber-900 font-black border-amber-400 pulse-active';
                                        }

                                        return (
                                            <div
                                                key={item.letter}
                                                style={{
                                                    transform: `translate(${x}px, ${y}px)`,
                                                    animationDelay: `${idx * 45}ms`
                                                }}
                                                className="node-slot absolute z-20"
                                            >
                                                <div
                                                    className={`rosco-node w-8 h-8 sm:w-10 sm:h-10 md:w-11 md:h-11 rounded-full flex items-center justify-center font-bold text-sm sm:text-base md:text-lg border-2 select-none ${bgColor} ${fx} ${isActive ? 'active' : ''}`}
                                                >
                                                    {item.letter}
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>

                            {/* COLUMNA DERECHA: TARJETA DE PREGUNTA Y CONTROLES */}
                            <div className="lg:col-span-6 flex flex-col justify-center">
                                <div className={`glass-panel rounded-3xl p-6 sm:p-8 shadow-soft border border-emerald-200 relative overflow-hidden anim-in delay-1 ${flash === 'correct' ? 'flash-correct' : ''} ${flash === 'wrong' ? 'flash-wrong' : ''}`}>
                                    <div className="absolute -right-10 -top-10 w-40 h-40 bg-emerald-300/40 rounded-full blur-3xl pointer-events-none"></div>

                                    {/* Cartel flotante de acierto / error */}
                                    {flash && (
                                        <div className={`toast-fx ${flash === 'correct' ? 'text-emerald-600' : 'text-rose-500'}`}>
                                            {flash === 'correct' ? `¡BIEN! +${PUNTOS_POR_LETRA}` : '¡UPS! +0'}
                                        </div>
                                    )}

                                    {/* Indicador de Tipo de Pregunta */}
                                    <div className="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-emerald-100 border border-emerald-300 text-emerald-800 text-xs font-bold mb-4">
                                        <i className="fa-solid fa-lightbulb text-amber-500 animate-pulse"></i>
                                        <span>{currentItem.type === 'EMPIEZA' ? `CON LA LETRA ${currentItem.letter}` : `CONTIENE LA LETRA ${currentItem.letter}`}</span>
                                    </div>

                                    {/* Enunciado de la Pista */}
                                    <p key={currentItem.letter} className="anim-in text-lg sm:text-xl font-medium text-emerald-900 min-h-[90px] flex items-center leading-relaxed">
                                        "{currentItem.clue}"
                                    </p>

                                    {/* Formulario de Entrada */}
                                    <form onSubmit={handleSubmit} className="mt-6 flex flex-col gap-4">
                                        <div className="relative">
                                            <input
                                                ref={inputRef}
                                                type="text"
                                                value={inputVal}
                                                onChange={(e) => setInputVal(e.target.value)}
                                                placeholder={isLocked ? 'Preparando la siguiente letra...' : 'Escribe tu respuesta aquí...'}
                                                disabled={isLocked}
                                                className="input-fx w-full bg-white border-2 border-emerald-200 focus:border-emerald-400 rounded-2xl px-5 py-4 text-emerald-900 placeholder-emerald-400/70 text-lg font-semibold focus:outline-none focus:ring-4 focus:ring-emerald-200/80 shadow-inner"
                                                autoComplete="off"
                                                spellCheck="false"
                                            />
                                        </div>

                                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                            <button
                                                type="submit"
                                                disabled={isLocked}
                                                className="btn-fx disabled:opacity-50 disabled:cursor-not-allowed w-full bg-gradient-to-r from-emerald-200 to-teal-200 text-emerald-900 font-extrabold py-3.5 px-6 rounded-2xl shadow-md shadow-emerald-200 border border-emerald-300 flex items-center justify-center gap-2"
                                            >
                                                <i className="fa-solid fa-paper-plane"></i>
                                                <span>Enviar Respuesta</span>
                                            </button>

                                            <button
                                                type="button"
                                                onClick={handlePasapalabra}
                                                disabled={isLocked}
                                                className="btn-fx disabled:opacity-50 disabled:cursor-not-allowed w-full bg-gradient-to-r from-amber-100 to-orange-200 text-amber-900 font-extrabold py-3.5 px-6 rounded-2xl shadow-md shadow-amber-200 border border-amber-300 flex items-center justify-center gap-2"
                                            >
                                                <i className="fa-solid fa-forward-step"></i>
                                                <span>Pasapalabra</span>
                                            </button>
                                        </div>
                                    </form>

                                    {/* Botones secundarios */}
                                    <div className="mt-6 pt-4 border-t border-emerald-200 flex items-center justify-center gap-5 flex-wrap text-xs text-emerald-700/90">
                                        <span className="inline-flex items-center gap-1.5 text-emerald-700/90">
                                            <i className="fa-solid fa-ranking-star text-emerald-600"></i>
                                            Tu puedes! Piensa Veloz!
                                        </span>
                                    </div>
                                </div>
                            </div>
                        </main>
                    )}

                    {/* PANTALLA FINAL DE RESULTADOS */}
                    {gameState === 'FINISHED' && (
                        <main className="my-auto py-6 max-w-4xl mx-auto w-full">
                            <Confetti pieces={110} />
                            <div className="glass-panel rounded-3xl p-6 sm:p-10 shadow-soft border border-emerald-300 text-center anim-zoom">
                                
                                {/* Cartel del Día del Estudiante */}
                                <div className="party-banner rounded-3xl px-5 py-5 mb-6 anim-zoom">
                                    <div className="text-3xl mb-1 flex justify-center gap-2">
                                        <span className="party-emoji">🎉</span>
                                        <span className="party-emoji" style={{ animationDelay: '.18s' }}>🎓</span>
                                        <span className="party-emoji" style={{ animationDelay: '.36s' }}>🥳</span>
                                    </div>
                                    <h3 className="text-2xl sm:text-3xl font-black text-emerald-900 drop-shadow-sm">
                                        ¡Feliz Día del Estudiante!
                                    </h3>
                                    <p className="text-sm sm:text-base font-semibold text-emerald-800 mt-2 max-w-xl mx-auto">
                                        {frase}
                                    </p>
                                    <p className="text-[11px] uppercase tracking-widest font-bold text-emerald-700/80 mt-3">
                                        21 de septiembre • IEM "Dr. Arturo Oñativia" — UNSa
                                    </p>
                                </div>

                                <div className="inline-flex p-4 bg-amber-100 rounded-full text-amber-500 text-4xl mb-4 trophy-fx">
                                    <i className="fa-solid fa-trophy"></i>
                                </div>

                                <h2 className="text-3xl sm:text-4xl font-black text-emerald-900 mb-2 anim-in delay-1">
                                    ¡Juego Finalizado!
                                </h2>
                                <p className="text-emerald-700 text-sm sm:text-base font-semibold mb-6 anim-in delay-2 max-w-xl mx-auto">
                                    Ser estudiante es animarse a preguntar, equivocarse y volver a intentarlo.
                                    ¡Que la pases espectacular en tu día! 🎓🎈
                                </p>

                                {/* Resumen cuantitativo */}
                                {/* Puntaje final con bonus por rapidez */}
                                <div className="anim-zoom mb-7 mx-auto max-w-md px-6 py-5 rounded-3xl bg-gradient-to-r from-emerald-100 via-teal-100 to-emerald-100 border border-emerald-300 shadow-soft">
                                    <div className="text-[11px] uppercase font-bold tracking-wider text-emerald-700/90">Puntaje final</div>
                                    <div className="flex items-center justify-center gap-2 mt-1">
                                        <i className="fa-solid fa-star text-amber-500 text-2xl"></i>
                                        <span className="text-4xl font-black text-emerald-800 leading-none">{puntaje.total}</span>
                                        <span className="text-sm font-bold text-emerald-600 self-end mb-1">puntos</span>
                                    </div>

                                    {/* Desglose */}
                                    <div className="mt-4 pt-3 border-t border-dashed border-emerald-600/30 text-xs font-semibold text-emerald-800 space-y-1.5">
                                        <div className="flex items-center justify-between">
                                            <span className="flex items-center gap-1.5">
                                                <i className="fa-solid fa-circle-check text-emerald-600"></i>
                                                {stats.correct} aciertos × {PUNTOS_POR_LETRA} pts
                                            </span>
                                            <span>{puntaje.base} <span className="text-emerald-600/80 font-bold">/ {PUNTAJE_MAXIMO}</span></span>
                                        </div>
                                        <div className="flex items-center justify-between">
                                            <span className="flex items-center gap-1.5">
                                                <i className="fa-solid fa-bolt text-amber-500"></i>
                                                Bonus por rapidez (+{puntaje.porcentaje}%)
                                            </span>
                                            <span className={puntaje.bonus > 0 ? 'text-amber-600 font-black' : 'text-emerald-700/60'}>
                                                +{puntaje.bonus}
                                            </span>
                                        </div>
                                        <div className="flex items-center justify-between text-emerald-700/80 font-medium">
                                            <span className="flex items-center gap-1.5">
                                                <i className="fa-solid fa-stopwatch text-emerald-600"></i>
                                                Te sobraron
                                            </span>
                                            <span className="font-mono font-bold">{formatTime(timeLeft)}</span>
                                        </div>
                                    </div>

                                    <p className="mt-3 text-[10px] text-emerald-700/70 font-medium">
                                        Cuanto antes termines, más porcentaje sumás sobre tu puntaje base.
                                    </p>
                                </div>

                                <div className="grid grid-cols-3 gap-4 mb-8">
                                    <div className="bg-emerald-100 border border-emerald-300 p-4 rounded-2xl anim-zoom delay-1 hover:scale-105 transition-transform">
                                        <div className="text-emerald-700 text-3xl font-black">{stats.correct}</div>
                                        <div className="text-xs text-emerald-600 font-semibold uppercase mt-1">Aciertos</div>
                                    </div>
                                    <div className="bg-rose-100 border border-rose-300 p-4 rounded-2xl anim-zoom delay-2 hover:scale-105 transition-transform">
                                        <div className="text-rose-500 text-3xl font-black">{stats.wrong}</div>
                                        <div className="text-xs text-rose-500 font-semibold uppercase mt-1">Errores</div>
                                    </div>
                                    <div className="bg-amber-100 border border-amber-300 p-4 rounded-2xl anim-zoom delay-3 hover:scale-105 transition-transform">
                                        <div className="text-amber-600 text-3xl font-black">
                                            {Math.round((stats.correct / ROSCO_DATA.length) * 100)}%
                                        </div>
                                        <div className="text-xs text-amber-700 font-semibold uppercase mt-1">Efectividad</div>
                                    </div>
                                </div>

                               

                                <button
                                    onClick={restartGame}
                                    className="btn-fx bg-gradient-to-r from-emerald-200 via-teal-200 to-emerald-300 text-emerald-900 font-extrabold px-8 py-4 rounded-2xl shadow-md shadow-emerald-200 border border-emerald-300 text-lg"
                                >
                                    <i className="fa-solid fa-rotate-right mr-2"></i> Jugar Nuevo Pasapalabra
                                </button>
                            </div>
                        </main>
                    )}

                    {/* PIE DE PÁGINA FESTIVO */}
                    <footer className="footer-fest rounded-2xl px-4 py-4 mt-5 text-center anim-in delay-3">

                        {/* Guirnalda de iconos animados */}
                        <div className="footer-garland relative z-10" aria-hidden="true">
                            {['fa-graduation-cap', 'fa-book-open-reader', 'fa-lightbulb',
                              'fa-star', 'fa-pencil'
                            ].map((icono, i) => (
                                <i
                                    key={icono}
                                    className={`fa-solid ${icono} garland-item`}
                                    style={{ animationDelay: `${i * 0.28}s` }}
                                ></i>
                            ))}
                        </div>

                        {/* Saludo principal */}
                        <p className="relative z-10 text-sm sm:text-base footer-title">
                            ¡Feliz Día del Estudiante!
                        </p>
                        <p className="relative z-10 text-[10px] uppercase tracking-widest font-semibold text-emerald-700/70 mt-1">
                            21 de septiembre • ¡Que la pases espectacular!
                        </p>

                        {/* Firma institucional */}
                        <p className="relative z-10 text-[10px] text-emerald-800/70 mt-3 pt-3 border-t border-dashed border-emerald-600/30">
                            <i className="fa-solid fa-school text-emerald-600/70 mr-1.5"></i>
                            Instituto de Educación Media "Dr. Arturo Oñativia" • Universidad Nacional de Salta
                        </p>
                    </footer>

                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
