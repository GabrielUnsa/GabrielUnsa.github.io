<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Desafío Digital · Intertribus IEM</title>
<link rel="icon" type="image/png" href="../logo-iem-sin-fondo.png">
<style>
  :root {
    --bg: #fff6ea;
    --bg-2: #ffe7c7;
    --card: #ffffff;
    --ink: #2b1a0e;
    --muted: #7a5a40;
    --line: #f0dcc4;
    --orange: #f57c00;
    --orange-deep: #c25e00;
    --red: #d62828;
    --red-deep: #9e1b1b;
    --red-soft: #fde4e4;
    --yellow: #f5b800;
    --yellow-deep: #8a6400;
    --yellow-soft: #fff3c4;
    --ok: #1f8a4c;
    --ok-soft: #dff5e8;
    --bad: #c62828;
    --bad-soft: #fde4e4;
    --iem: #258543;
    --radius: 18px;
    --shadow: 0 10px 30px rgba(120, 60, 0, .12);
  }
  * { box-sizing: border-box; }
  html { font-size: clamp(15px, .55vw + 11px, 21px); }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    color: var(--ink);
    background: radial-gradient(1200px 600px at 10% -10%, #ffd9d9 0%, transparent 60%),
                radial-gradient(1200px 600px at 90% -10%, #fff0b3 0%, transparent 60%),
                linear-gradient(180deg, var(--bg) 0%, var(--bg-2) 100%);
    background-attachment: fixed;
  }
  button { font: inherit; color: inherit; cursor: pointer; }
  button:disabled { cursor: not-allowed; opacity: .5; }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 16px; }

  /* ---------- Encabezado ---------- */
  .top {
    display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px;
    justify-content: space-between; margin-bottom: 16px;
  }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand img { width: 52px; height: 52px; object-fit: contain; }
  .brand h1 { margin: 0; font-size: 1.5rem; line-height: 1.1; letter-spacing: -.01em; }
  .brand h1 span { color: var(--orange); }
  .brand p { margin: 2px 0 0; color: var(--muted); font-size: .85rem; }
  .levels { display: flex; gap: 6px; background: var(--card); padding: 5px; border-radius: 999px; box-shadow: var(--shadow); }
  .levels button {
    border: 0; background: transparent; padding: 8px 16px; border-radius: 999px;
    font-weight: 700; display: flex; flex-direction: column; align-items: center; line-height: 1.1;
  }
  .levels button small { font-weight: 500; font-size: .7rem; color: var(--muted); }
  .levels button[aria-selected="true"] { background: var(--orange); color: #fff; }
  .levels button[aria-selected="true"] small { color: #fff; }
  .tools { display: flex; gap: 8px; align-items: center; }
  .icon-btn {
    border: 0; background: var(--card); width: 44px; height: 44px; border-radius: 50%;
    box-shadow: var(--shadow); font-size: 1.1rem; display: grid; place-items: center;
  }
  .menu { position: relative; }
  .menu > summary { list-style: none; }
  .menu > summary::-webkit-details-marker { display: none; }
  .menu-pop {
    position: absolute; right: 0; top: 52px; z-index: 20; background: var(--card);
    border-radius: 14px; box-shadow: 0 16px 40px rgba(0,0,0,.18); padding: 6px; min-width: 250px;
  }
  .menu-pop button {
    display: block; width: 100%; text-align: left; border: 0; background: transparent;
    padding: 10px 12px; border-radius: 10px;
  }
  .menu-pop button:hover { background: var(--bg); }

  /* ---------- Equipos ---------- */
  .teams { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 16px; }
  .team {
    position: relative; background: var(--card); border-radius: var(--radius); padding: 14px 16px;
    box-shadow: var(--shadow); border: 3px solid transparent; text-align: left; width: 100%;
    display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; align-items: center;
    transition: transform .2s, border-color .2s, box-shadow .2s;
  }
  .team.rojo { --c: var(--red); --c-deep: var(--red-deep); --c-soft: var(--red-soft); }
  .team.amarillo { --c: var(--yellow); --c-deep: var(--yellow-deep); --c-soft: var(--yellow-soft); }
  .team.active { border-color: var(--c); background: var(--c-soft); transform: translateY(-2px); }
  .team .dot {
    width: 54px; height: 54px; border-radius: 50%; background: var(--c); grid-row: span 2;
    display: grid; place-items: center; font-size: 1.6rem; color: #fff;
    box-shadow: inset 0 -4px 0 rgba(0,0,0,.15);
  }
  .team h2 { margin: 0; font-size: 1.25rem; color: var(--c-deep); display: flex; align-items: center; gap: 8px; }
  .turn-tag {
    font-size: .65rem; font-weight: 800; letter-spacing: .08em; text-transform: uppercase;
    background: var(--c); color: #fff; padding: 3px 8px; border-radius: 999px;
  }
  .team.amarillo .turn-tag { color: var(--ink); }
  .stats { display: flex; flex-wrap: wrap; gap: 6px 18px; }
  .stat { display: flex; align-items: center; gap: 6px; }
  .stat b { font-size: 1.5rem; font-variant-numeric: tabular-nums; }
  .stat span { color: var(--muted); font-size: .8rem; }
  .adj { display: inline-flex; gap: 2px; margin-left: 2px; }
  .adj button {
    border: 1px solid var(--line); background: #fff; width: 24px; height: 24px; border-radius: 6px;
    font-size: .8rem; line-height: 1; padding: 0;
  }

  /* ---------- Escenario ---------- */
  .stage {
    background: var(--card); border-radius: 26px; box-shadow: var(--shadow);
    padding: clamp(18px, 3vw, 36px); min-height: 420px; position: relative; overflow: hidden;
  }
  .center { text-align: center; }
  .turn-banner {
    display: inline-flex; align-items: center; gap: 10px; padding: 8px 18px; border-radius: 999px;
    font-weight: 800; font-size: 1.1rem; margin-bottom: 18px;
  }
  .turn-banner.rojo { background: var(--red-soft); color: var(--red-deep); }
  .turn-banner.amarillo { background: var(--yellow-soft); color: var(--yellow-deep); }
  .turn-banner i { width: 16px; height: 16px; border-radius: 50%; display: inline-block; }
  .turn-banner.rojo i { background: var(--red); }
  .turn-banner.amarillo i { background: var(--yellow); }
  .big-title { font-size: clamp(1.6rem, 3.2vw, 2.6rem); margin: 0 0 8px; line-height: 1.15; }
  .sub { color: var(--muted); margin: 0 0 24px; }

  .cats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin: 0 auto 28px; max-width: 900px; }
  .cat {
    border: 2px solid var(--line); border-radius: 16px; padding: 14px 10px; text-align: center;
    transition: transform .12s, background .12s, border-color .12s, opacity .2s; background: #fff;
  }
  .cat .ico { font-size: 2rem; display: block; }
  .cat .nm { font-weight: 700; font-size: .85rem; display: block; margin-top: 4px; min-height: 2.4em; }
  .cat .ct { font-size: .75rem; color: var(--muted); }
  .cat.off { opacity: .35; }
  .cat.hot { border-color: var(--hue); background: color-mix(in srgb, var(--hue) 14%, #fff); transform: scale(1.06); }
  .cat.picked { border-color: var(--hue); background: var(--hue); color: #fff; transform: scale(1.1); }
  .cat.picked .ct { color: #fff; }

  .btn {
    border: 0; border-radius: 999px; padding: 16px 34px; font-weight: 800; font-size: 1.2rem;
    background: var(--orange); color: #fff; box-shadow: 0 6px 0 var(--orange-deep), 0 14px 26px rgba(245,124,0,.3);
    transition: transform .08s, box-shadow .08s;
  }
  .btn:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--orange-deep); }
  .btn.ghost { background: #fff; color: var(--ink); box-shadow: 0 0 0 2px var(--line); }
  .btn.huge { font-size: 1.5rem; padding: 22px 46px; }
  .btn-row { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-top: 22px; }

  /* Pregunta */
  .q-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 14px; }
  .q-cat {
    display: inline-flex; align-items: center; gap: 8px; padding: 6px 14px; border-radius: 999px;
    background: var(--hue); color: #fff; font-weight: 700; font-size: .9rem;
  }
  .q-text { font-size: clamp(1.35rem, 2.6vw, 2.1rem); line-height: 1.25; margin: 6px 0 22px; font-weight: 800; }
  .opts { display: grid; gap: 12px; }
  .opt {
    display: flex; align-items: center; gap: 14px; text-align: left; width: 100%;
    background: #fff; border: 3px solid var(--line); border-radius: 16px; padding: 14px 16px;
    font-size: clamp(1.02rem, 1.6vw, 1.3rem); font-weight: 600; transition: border-color .12s, background .12s, transform .12s;
  }
  .opt:not(:disabled):hover { border-color: var(--orange); transform: translateX(4px); }
  .opt:disabled { opacity: 1; cursor: default; }
  .opt .letter {
    flex: none; width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center;
    background: var(--bg-2); font-weight: 900; color: var(--orange-deep);
  }
  .opt.correct { border-color: var(--ok); background: var(--ok-soft); }
  .opt.correct .letter { background: var(--ok); color: #fff; }
  .opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
  .opt.wrong .letter { background: var(--bad); color: #fff; }
  .opt.dim { opacity: .45; }

  .verdict {
    margin-top: 22px; border-radius: 18px; padding: 16px 20px; display: flex; align-items: center; gap: 16px;
    flex-wrap: wrap; justify-content: space-between; animation: pop .35s cubic-bezier(.2,1.4,.4,1) both;
  }
  .verdict.ok { background: var(--ok-soft); color: #0f5a30; }
  .verdict.bad { background: var(--bad-soft); color: #8e1c1c; }
  .verdict strong { font-size: clamp(1.5rem, 3vw, 2.2rem); display: block; }
  .verdict p { margin: 2px 0 0; }
  @keyframes pop { from { transform: scale(.85); opacity: 0; } to { transform: scale(1); opacity: 1; } }

  /* Ruleta */
  .wheel-area { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 28px; align-items: center; }
  .wheel-box { position: relative; width: min(100%, 440px); aspect-ratio: 1; margin: 0 auto; }
  .wheel-box svg.wheel {
    width: 100%; height: 100%; display: block; border-radius: 50%;
    box-shadow: 0 0 0 8px #fff, 0 0 0 12px var(--orange), 0 18px 40px rgba(0,0,0,.2);
    transition: transform 5s cubic-bezier(.12,.7,.12,1);
  }
  .wheel-box .pointer {
    position: absolute; left: 50%; top: -18px; transform: translateX(-50%); width: 0; height: 0;
    border-left: 20px solid transparent; border-right: 20px solid transparent; border-top: 40px solid var(--ink);
    filter: drop-shadow(0 3px 2px rgba(0,0,0,.3)); z-index: 2;
  }
  .wheel-box .hub {
    position: absolute; inset: 0; margin: auto; width: 22%; height: 22%; border-radius: 50%;
    background: #fff; box-shadow: 0 4px 12px rgba(0,0,0,.25); display: grid; place-items: center;
    border: 0; font-weight: 900; font-size: .95rem; color: var(--orange-deep);
  }
  .wheel-box .hub:disabled { opacity: 1; cursor: default; }
  .w-big { font-size: 20px; font-weight: 900; fill: #fff; text-anchor: middle; dominant-baseline: middle; }
  .w-small { font-size: 7.5px; font-weight: 700; fill: #fff; text-anchor: middle; dominant-baseline: middle; letter-spacing: .06em; text-transform: uppercase; }
  .legend { list-style: none; padding: 0; margin: 0 0 16px; display: grid; gap: 8px; }
  .legend li { display: flex; align-items: center; gap: 10px; }
  .legend i { width: 18px; height: 18px; border-radius: 5px; flex: none; }
  .prize {
    border-radius: 18px; padding: 18px 20px; background: var(--bg); text-align: center;
    animation: pop .4s cubic-bezier(.2,1.4,.4,1) both;
  }
  .prize .emo { font-size: 3rem; display: block; }
  .prize strong { font-size: clamp(1.5rem, 3vw, 2.2rem); display: block; }

  /* Historial */
  .history { margin-top: 16px; background: rgba(255,255,255,.7); border-radius: var(--radius); padding: 12px 16px; }
  .history summary { cursor: pointer; font-weight: 700; }
  .history ol { margin: 10px 0 0; padding-left: 1.4em; display: grid; gap: 6px; }
  .history li { font-size: .9rem; }
  .history .t { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 4px; }
  .history .t.rojo { background: var(--red); }
  .history .t.amarillo { background: var(--yellow); }
  .foot { text-align: center; color: var(--muted); font-size: .8rem; margin-top: 14px; }
  kbd { background: #fff; border: 1px solid var(--line); border-radius: 5px; padding: 0 5px; font-family: inherit; }

  /* Confeti */
  .confetti { position: fixed; inset: 0; pointer-events: none; z-index: 50; overflow: hidden; }
  .confetti span {
    position: absolute; top: -20px; width: 10px; height: 16px; border-radius: 2px;
    animation: fall linear forwards;
  }
  @keyframes fall { to { transform: translateY(110vh) rotate(720deg); } }

  @media (max-width: 760px) {
    .team { grid-template-columns: 1fr; padding: 12px; }
    .team .dot { display: none; }
    .team h2 { font-size: 1.05rem; }
    .stats { gap: 2px 12px; }
    .stat b { font-size: 1.2rem; }
    .cats { grid-template-columns: repeat(2, 1fr); }
    .wheel-area { grid-template-columns: 1fr; }
    .levels { width: 100%; justify-content: space-between; }
    .levels button { flex: 1; padding: 8px 6px; }
  }
  @media (max-width: 520px) {
    .adj { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    .wheel-box svg.wheel { transition-duration: 1.2s; }
    .confetti { display: none; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <img src="../logo-iem-sin-fondo.png" alt="Logo del IEM">
      <div>
        <h1>Desafío <span>Digital</span></h1>
        <p>Intertribus · IEM “Dr. Arturo Oñativia” · UNSa</p>
      </div>
    </div>
    <nav class="levels" id="levels" role="tablist" aria-label="Categoría de edad"></nav>
    <div class="tools">
      <button class="icon-btn" id="soundBtn" title="Activar o silenciar el sonido" aria-label="Sonido">🔊</button>
      <details class="menu" id="menu">
        <summary class="icon-btn" title="Opciones" aria-label="Opciones">⚙️</summary>
        <div class="menu-pop">
          <button id="resetLevel">↺ Reiniciar esta categoría</button>
          <button id="resetAll">⟲ Reiniciar todo el juego</button>
        </div>
      </details>
    </div>
  </header>

  <section class="teams" id="teams" aria-label="Equipos"></section>
  <section class="stage" id="stage" aria-live="polite"></section>

  <details class="history" id="history">
    <summary>Preguntas ya jugadas</summary>
    <ol id="historyList"></ol>
  </details>
  <p class="foot">
    Atajos: <kbd>Enter</kbd> botón principal · <kbd>1</kbd>–<kbd>4</kbd> o <kbd>A</kbd>–<kbd>D</kbd> elegir respuesta.
    El progreso se guarda en este navegador.
  </p>
</div>

   DATOS

/* ============================================================
   ESTADO (se guarda en localStorage)
   ============================================================ */
const KEY = 'intertribus-desafio-digital-v1';
const freshTeam = () => ({ pos: 0, cup: 0, ok: 0, tot: 0 });
const freshLevel = () => ({ used: {}, log: [], turn: 'rojo', teams: { rojo: freshTeam(), amarillo: freshTeam() } });
function freshState() {
  const s = { level: 'menores', sound: true, data: {} };
  for (const lv of LEVELS) s.data[lv.id] = freshLevel();
  return s;
}
function loadState() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) {
      const s = JSON.parse(raw);
      const base = freshState();
      for (const lv of LEVELS) if (!s.data?.[lv.id]) (s.data ??= {})[lv.id] = base.data[lv.id];
      if (!LEVELS.some(l => l.id === s.level)) s.level = 'menores';
      return s;
    }
  } catch (e) { /* almacenamiento no disponible: se juega sin guardar */ }
  return freshState();
}
let state = loadState();
function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }

/* Estado de la sesión (no se guarda). */
const ui = { phase: 'idle', current: null, picked: null, prize: null, rot: 0, busy: false };

const L = () => state.data[state.level];
const remaining = () => QUESTIONS[state.level].filter(q => !(q.id in L().used));
const other = t => (t === 'rojo' ? 'amarillo' : 'rojo');
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const findQ = id => QUESTIONS[state.level].find(q => q.id === id);

/* ============================================================
   SONIDO
   ============================================================ */
let actx = null;
function tone(freq, dur = .12, type = 'sine', when = 0, vol = .18) {
  if (!state.sound) return;
  try {
    actx ??= new (window.AudioContext || window.webkitAudioContext)();
    const t = actx.currentTime + when;
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(g).connect(actx.destination);
    o.start(t); o.stop(t + dur + .02);
  } catch (e) {}
}
const sfx = {
  tick: () => tone(880, .05, 'square', 0, .06),
  pick: () => { tone(660, .1); tone(990, .16, 'sine', .1); },
  ok:   () => [523, 659, 784, 1047].forEach((f, i) => tone(f, .18, 'triangle', i * .09)),
  bad:  () => { tone(220, .25, 'sawtooth', 0, .12); tone(165, .35, 'sawtooth', .2, .12); },
  win:  () => [784, 988, 1175, 1568].forEach((f, i) => tone(f, .2, 'triangle', i * .08)),
  lose: () => { tone(392, .2, 'triangle'); tone(294, .3, 'triangle', .18); },
};

/* ============================================================

const $ = s => document.querySelector(s);
function h(tag, attrs = {}, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k === 'style') el.style.cssText = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const k of kids.flat()) if (k != null && k !== false) el.append(k.nodeType ? k : document.createTextNode(k));
  return el;
}
const locked = () => !['idle', 'empty'].includes(ui.phase);

function renderLevels() {
  const nav = $('#levels'); nav.replaceChildren();
  for (const lv of LEVELS) {
    nav.append(h('button', {

      onclick: () => { if (locked()) return; state.level = lv.id; save(); ui.phase = 'idle'; renderAll(); },

        h('div', { class: 'stat' }, h('b', {}, `${t.ok}/${t.tot}`), h('span', {}, 'aciertos')),

function catCards(highlight, picked) {
  const rem = remaining();
  return h('div', { class: 'cats' }, Object.entries(CATS).map(([id, c]) => {
    const n = rem.filter(q => q.cat === +id).length;
    const cls = ['cat', n ? '' : 'off', +id === highlight ? 'hot' : '', +id === picked ? 'picked' : ''].join(' ');
    return h('div', { class: cls, style: `--hue:${c.hue}`, 'data-cat': id },
      h('span', { class: 'ico', 'aria-hidden': 'true' }, c.icon),
      h('span', { class: 'nm' }, c.name),
      h('span', { class: 'ct' }, n === 1 ? 'queda 1' : `quedan ${n}`));
  }));
}

function turnBanner(team, prefix = 'Turno del') {
  return h('div', { class: `turn-banner ${team}` }, h('i'), `${prefix} ${TEAMS[team].name}`);
}

function renderStage() {
  const st = $('#stage'); st.replaceChildren();
  const lv = LEVELS.find(l => l.id === state.level);
  const total = QUESTIONS[state.level].length, left = remaining().length;

  if (ui.phase === 'idle' && left === 0) ui.phase = 'empty';
  if (ui.phase === 'empty' && left > 0) ui.phase = 'idle';

  if (ui.phase === 'idle') {
    st.append(h('div', { class: 'center' },
      turnBanner(L().turn),
      h('h2', { class: 'big-title' }, '¿Listos para la pregunta?'),
      h('p', { class: 'sub' }, `${lv.name} (${lv.years}) · quedan ${left} de ${total} preguntas. Saldrá una categoría al azar.`),

      h('button', { class: 'btn huge', 'data-primary': '', onclick: drawQuestion }, '🎲 Pedir pregunta'),

  else if (ui.phase === 'drawing') {
    st.append(h('div', { class: 'center' },
      turnBanner(L().turn),
      h('h2', { class: 'big-title' }, 'Sorteando categoría…'),
      h('p', { class: 'sub' }, '¡Mucha suerte!'),
      catCards(),

  }

  else if (ui.phase === 'question' || ui.phase === 'answered') {
    const q = ui.current, c = CATS[q.cat], answered = ui.phase === 'answered';
    const team = ui.current.team;
    const opts = h('div', { class: 'opts' }, q.order.map((oi, pos) => {
      let cls = 'opt';
      if (answered) {
        if (oi === q.answer) cls += ' correct';
        else if (oi === ui.picked) cls += ' wrong';
        else cls += ' dim';
      }
      return h('button', { class: cls, disabled: answered, onclick: () => answer(oi) },
        h('span', { class: 'letter' }, 'ABCD'[pos]), q.opts[oi]);
    }));
    st.append(
      h('div', { class: 'q-head' },
        h('span', { class: 'q-cat', style: `--hue:${c.hue}` }, c.icon, ' ', c.name),
        turnBanner(team, 'Responde el')),
      h('p', { class: 'q-text' }, q.text),
      opts,
    );
    if (answered) {
      const ok = ui.picked === q.answer;
      st.append(h('div', { class: `verdict ${ok ? 'ok' : 'bad'}` },
        h('div', {},
          h('strong', {}, ok ? '✅ ¡Correcta!' : '❌ Incorrecta'),
          h('p', {}, ok ? `¡Bien, ${TEAMS[team].name}! Ganaron un giro de la ruleta.`
                        : `La respuesta correcta era: “${q.opts[q.answer]}”.`)),
        ok ? h('button', { class: 'btn', 'data-primary': '', onclick: () => { ui.phase = 'wheel'; renderAll(); } }, '🎡 Girar la ruleta')
           : h('button', { class: 'btn', 'data-primary': '', onclick: nextTurn }, `Turno del ${TEAMS[other(team)].name} ➜`),
      ));

  else if (ui.phase === 'wheel' || ui.phase === 'prize') {
    const team = ui.current.team;
    const legend = h('ul', { class: 'legend' },
      h('li', {}, h('i', { style: 'background:#1f7a45' }), 'Avanzar 1, 2 o 3 casillas'),
      h('li', {}, h('i', { style: 'background:#f57c00' }), 'Ganar un cupón'),
      h('li', {}, h('i', { style: 'background:#4b5363' }), 'Retroceder 1 o 2 casillas'));
    let side;
    if (ui.phase === 'prize') {
      const w = WHEEL[ui.prize];
      side = h('div', {},
        h('div', { class: 'prize' },
          h('span', { class: 'emo', 'aria-hidden': 'true' }, w.emo),
          h('strong', {}, w.text),
          h('p', {}, `${TEAMS[team].name}: casilla ${L().teams[team].pos} · ${L().teams[team].cup} ${L().teams[team].cup === 1 ? 'cupón' : 'cupones'}`)),
        h('div', { class: 'btn-row' },
          h('button', { class: 'btn', 'data-primary': '', onclick: nextTurn }, `Turno del ${TEAMS[other(team)].name} ➜`)));

        h('button', { class: 'btn huge', 'data-primary': '', id: 'spinBtn', onclick: spin }, '🎡 ¡Girar!'));

      h('p', {}, `🟡 Amarillo: casilla ${a.pos}, ${a.cup} cupones, ${a.ok}/${a.tot} aciertos`),
      h('div', { class: 'btn-row' },
        h('button', { class: 'btn ghost', onclick: resetLevel }, '↺ Reiniciar esta categoría')),
    ));

function wheelEl() {
  const n = WHEEL.length, step = 360 / n, r = 100;
  const pt = a => { const t = a * Math.PI / 180; return `${(r * Math.sin(t)).toFixed(3)} ${(-r * Math.cos(t)).toFixed(3)}`; };
  let inner = '';
  WHEEL.forEach((w, i) => {
    const a0 = i * step, a1 = a0 + step, mid = a0 + step / 2;
    inner += `<path d="M0 0 L${pt(a0)} A${r} ${r} 0 0 1 ${pt(a1)} Z" fill="${w.color}" stroke="#fff" stroke-width="1.5"/>`;
    inner += `<g transform="rotate(${mid})"><text class="w-small" y="-84">${w.small}</text><text class="w-big" y="-58">${w.big}</text></g>`;
  });
  const box = h('div', { class: 'wheel-box' });
  box.innerHTML = `<div class="pointer"></div>
    <svg class="wheel" id="wheel" viewBox="-100 -100 200 200" role="img" aria-label="Ruleta de premios"
         style="transform:rotate(${ui.rot}deg)">${inner}</svg>`;
  box.append(h('button', { class: 'hub', onclick: spin, disabled: ui.phase !== 'wheel', 'aria-label': 'Girar la ruleta' }, 'IEM'));
  return box;
}

function renderHistory() {
  const list = $('#historyList'); list.replaceChildren();
  const log = L().log;
  $('#history summary').textContent = `Preguntas ya jugadas en ${LEVELS.find(l => l.id === state.level).name} (${log.length})`;
  if (!log.length) { list.append(h('li', { style: 'list-style:none;margin-left:-1.4em;color:var(--muted)' }, 'Todavía no salió ninguna pregunta.')); return; }
  for (const e of log) {
    const q = findQ(e.id); if (!q) continue;
    const res = e.ok == null ? '⏳ sin responder' : e.ok ? '✅' : '❌';
    const prize = e.prize != null ? ` · ${WHEEL[e.prize].text}` : '';
    list.append(h('li', {}, h('span', { class: `t ${e.team}` }), `${TEAMS[e.team].name} · ${CATS[q.cat].icon} ${q.text} ${res}${prize}`));
  }
}

function renderAll() {
  renderLevels(); renderTeams(); renderStage(); renderHistory();
  $('#soundBtn').textContent = state.sound ? '🔊' : '🔇';
}

/* ============================================================
   ACCIONES
   ============================================================ */
function drawQuestion() {
  if (ui.phase !== 'idle' || ui.busy) return;
  const avail = remaining();
  if (!avail.length) { renderAll(); return; }
  const cats = [...new Set(avail.map(q => q.cat))];
  const cat = pick(cats);
  const q = pick(avail.filter(x => x.cat === cat));
  const team = L().turn;

  // Se marca como usada apenas sale: ya no le puede tocar al otro equipo.
  L().used[q.id] = team;
  L().log.push({ id: q.id, team, ok: null, prize: null });
  save();
  ui.current = { ...q, team, order: shuffle(q.opts.map((_, i) => i)) };
  ui.picked = null; ui.prize = null;
  ui.phase = 'drawing'; ui.busy = true;
  renderAll();

  // Animación: el resaltado recorre las categorías disponibles y frena en la elegida.
  const seq = [];
  const steps = 10 + cats.indexOf(cat);
  for (let i = 0; i <= steps; i++) seq.push(cats[i % cats.length]);
  while (seq[seq.length - 1] !== cat) seq.push(cats[seq.length % cats.length]);
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let i = 0, delay = reduce ? 30 : 60;
  const step = () => {
    document.querySelectorAll('.cat').forEach(el => el.classList.toggle('hot', +el.dataset.cat === seq[i]));
    sfx.tick();
    if (++i < seq.length) { delay *= reduce ? 1 : 1.1; setTimeout(step, delay); }
    else {
      const el = document.querySelector(`.cat[data-cat="${cat}"]`);
      el?.classList.remove('hot'); el?.classList.add('picked');
      sfx.pick();
      setTimeout(() => { ui.busy = false; ui.phase = 'question'; renderAll(); }, reduce ? 200 : 700);
    }
  };
  step();
}

function answer(oi) {
  if (ui.phase !== 'question') return;
  const q = ui.current, ok = oi === q.answer, t = L().teams[q.team];
  ui.picked = oi; ui.phase = 'answered';
  t.tot++; if (ok) t.ok++;
  const entry = [...L().log].reverse().find(e => e.id === q.id);
  if (entry) entry.ok = ok;
  save();
  ok ? (sfx.ok(), confetti()) : sfx.bad();
  renderAll();
}

function spin() {
  if (ui.phase !== 'wheel' || ui.busy) return;
  ui.busy = true;
  const n = WHEEL.length, step = 360 / n;
  const idx = Math.floor(Math.random() * n);
  const jitter = (Math.random() - .5) * step * .7;
  // La flecha está arriba (0°). Para que el sector idx quede bajo la flecha,
  // la ruleta debe terminar girada -(centro del sector).
  const target = ((360 - (idx * step + step / 2 + jitter)) % 360 + 360) % 360;
  const delta = ((target - (ui.rot % 360)) % 360 + 360) % 360;
  ui.rot += 360 * 6 + delta;
  const wheel = $('#wheel');
  $('#spinBtn')?.setAttribute('disabled', '');
  document.querySelector('.hub')?.setAttribute('disabled', '');
  wheel.style.transform = `rotate(${ui.rot}deg)`;

  const dur = matchMedia('(prefers-reduced-motion: reduce)').matches ? 1200 : 5000;
  // Ticks que se van espaciando mientras frena.
  let tt = 0, gap = 60;
  while (tt < dur - 300) { setTimeout(sfx.tick, tt); tt += gap; gap *= 1.09; }

  setTimeout(() => {
    ui.busy = false;
    const w = WHEEL[idx], team = ui.current.team, t = L().teams[team];
    if (w.kind === 'adv') t.pos += w.n;
    else if (w.kind === 'back') t.pos = Math.max(0, t.pos - w.n);
    else t.cup++;
    const entry = [...L().log].reverse().find(e => e.id === ui.current.id);
    if (entry) entry.prize = idx;
    save();
    ui.prize = idx; ui.phase = 'prize';
    w.kind === 'back' ? sfx.lose() : (sfx.win(), confetti(w.kind === 'cup' ? 90 : 50));
    renderAll();
  }, dur + 150);
}

function nextTurn() {
  if (ui.busy) return;
  const team = ui.current?.team ?? L().turn;
  L().turn = other(team);
  save();
  ui.phase = 'idle'; ui.current = null; ui.picked = null; ui.prize = null;
  renderAll();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function resetLevel() {
  const lv = LEVELS.find(l => l.id === state.level);
  if (!confirm(`¿Reiniciar ${lv.name}? Se borran los puntajes y vuelven a estar disponibles todas sus preguntas.`)) return;
  state.data[state.level] = freshLevel(); save();
  ui.phase = 'idle'; ui.current = null; ui.busy = false;
  $('#menu').open = false; renderAll();
}
function resetAll() {
  if (!confirm('¿Reiniciar TODO el juego? Se borran los puntajes de las tres categorías.')) return;
  const sound = state.sound; state = freshState(); state.sound = sound; save();
  ui.phase = 'idle'; ui.current = null; ui.busy = false;
  $('#menu').open = false; renderAll();
}

function confetti(count = 50) {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const box = h('div', { class: 'confetti', 'aria-hidden': 'true' });
  const colors = ['#d62828', '#f5b800', '#f57c00', '#258543', '#ffffff'];
  for (let i = 0; i < count; i++) {
    box.append(h('span', { style:
      `left:${Math.random() * 100}vw;background:${pick(colors)};` +
      `animation-duration:${1.8 + Math.random() * 1.8}s;animation-delay:${Math.random() * .4}s;` +
      `transform:rotate(${Math.random() * 360}deg)` }));
  }
  document.body.append(box);
  setTimeout(() => box.remove(), 4200);
}

/* ============================================================
   EVENTOS
   ============================================================ */
$('#soundBtn').addEventListener('click', () => { state.sound = !state.sound; save(); renderAll(); if (state.sound) sfx.pick(); });
$('#resetLevel').addEventListener('click', resetLevel);
$('#resetAll').addEventListener('click', resetAll);
document.addEventListener('click', e => { if (!e.target.closest('#menu')) $('#menu').open = false; });

document.addEventListener('keydown', e => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const tag = e.target.tagName;
  if (ui.phase === 'question') {
    const k = e.key.toLowerCase();
    const pos = '1234'.indexOf(k) >= 0 ? '1234'.indexOf(k) : 'abcd'.indexOf(k);
    if (pos >= 0 && pos < ui.current.order.length) { e.preventDefault(); answer(ui.current.order[pos]); return; }
  }
  if (e.key === 'Enter' && tag !== 'BUTTON' && tag !== 'SUMMARY' && !e.target.closest('.team')) {
    const btn = document.querySelector('[data-primary]:not(:disabled)');
    if (btn) { e.preventDefault(); btn.click(); }
  }
});

renderAll();
</script>
</body>
</html>
